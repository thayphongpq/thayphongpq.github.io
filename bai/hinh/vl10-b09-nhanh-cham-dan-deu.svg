<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 370" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="370" fill="#ffffff"/>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <text x="260" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Đồ thị vận tốc – thời gian</text>
  <text x="260" y="58" text-anchor="middle" font-size="16" fill="#475569">Đồ thị v–t là một đoạn thẳng</text>
  <!-- lưới -->
  <g stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="50" y1="220" x2="230" y2="220"/><line x1="50" y1="160" x2="230" y2="160"/><line x1="50" y1="100" x2="230" y2="100"/>
    <line x1="106" y1="280" x2="106" y2="100"/><line x1="162" y1="280" x2="162" y2="100"/><line x1="218" y1="280" x2="218" y2="100"/>
    <line x1="300" y1="220" x2="480" y2="220"/><line x1="300" y1="160" x2="480" y2="160"/><line x1="300" y1="100" x2="480" y2="100"/>
    <line x1="356" y1="280" x2="356" y2="100"/><line x1="412" y1="280" x2="412" y2="100"/><line x1="468" y1="280" x2="468" y2="100"/>
  </g>
  <!-- đồ thị a -->
  <line x1="50" y1="288" x2="50" y2="72" stroke="#334155" stroke-width="2.5" marker-end="url(#k)"/>
  <line x1="42" y1="280" x2="255" y2="280" stroke="#334155" stroke-width="2.5" marker-end="url(#k)"/>
  <text x="58" y="78" font-size="16" fill="#334155">v (m/s)</text>
  <text x="258" y="268" text-anchor="end" font-size="16" fill="#334155">t (s)</text>
  <g font-size="16" fill="#0f172a">
    <text x="42" y="298" text-anchor="end">0</text>
    <text x="42" y="226" text-anchor="end">4</text><text x="42" y="166" text-anchor="end">8</text><text x="42" y="106" text-anchor="end">12</text>
    <text x="106" y="300" text-anchor="middle">2</text><text x="162" y="300" text-anchor="middle">4</text><text x="218" y="300" text-anchor="middle">6</text>
  </g>
  <line x1="50" y1="220" x2="162" y2="100" stroke="#dc2626" stroke-width="4"/>
  <circle cx="50" cy="220" r="5" fill="#dc2626"/><circle cx="162" cy="100" r="5" fill="#dc2626"/>
  <!-- đồ thị b -->
  <line x1="300" y1="288" x2="300" y2="72" stroke="#334155" stroke-width="2.5" marker-end="url(#k)"/>
  <line x1="292" y1="280" x2="505" y2="280" stroke="#334155" stroke-width="2.5" marker-end="url(#k)"/>
  <text x="308" y="78" font-size="16" fill="#334155">v (m/s)</text>
  <text x="510" y="268" text-anchor="end" font-size="16" fill="#334155">t (s)</text>
  <g font-size="16" fill="#0f172a">
    <text x="292" y="298" text-anchor="end">0</text>
    <text x="292" y="226" text-anchor="end">4</text><text x="292" y="166" text-anchor="end">8</text><text x="292" y="106" text-anchor="end">12</text>
    <text x="356" y="300" text-anchor="middle">2</text><text x="412" y="300" text-anchor="middle">4</text><text x="468" y="300" text-anchor="middle">6</text>
  </g>
  <line x1="300" y1="100" x2="468" y2="280" stroke="#2563eb" stroke-width="4"/>
  <circle cx="300" cy="100" r="5" fill="#2563eb"/><circle cx="468" cy="280" r="5" fill="#2563eb"/>
  <!-- chú thích -->
  <text x="150" y="330" text-anchor="middle" font-size="18" font-weight="700" fill="#dc2626">a) Nhanh dần đều</text>
  <text x="400" y="330" text-anchor="middle" font-size="18" font-weight="700" fill="#2563eb">b) Chậm dần đều</text>
  <text x="150" y="354" text-anchor="middle" font-size="16" fill="#0f172a">a = 2 m/s² &gt; 0</text>
  <text x="400" y="354" text-anchor="middle" font-size="16" fill="#0f172a">a = −2 m/s² &lt; 0</text>
</svg>
