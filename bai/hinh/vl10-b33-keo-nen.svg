<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 450" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="450" fill="#ffffff"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <text x="260" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Biến dạng kéo và biến dạng nén</text>
  <!-- tường -->
  <rect x="20" y="70" width="20" height="360" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
  <!-- vạch chiều dài tự nhiên l0 tại x = 280 -->
  <line x1="280" y1="95" x2="280" y2="432" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- 1. không biến dạng, y = 120, l0 = 240 px -->
  <text x="60" y="85" font-size="17" font-weight="700" fill="#0f172a">Không biến dạng: l = l₀</text>
  <polyline points="40,120 60,120 70,108 90,132 110,108 130,132 150,108 170,132 190,108 210,132 230,108 250,132 260,120 272,120" fill="none" stroke="#334155" stroke-width="3"/>
  <rect x="272" y="100" width="16" height="40" fill="#64748b"/>
  <line x1="42" y1="155" x2="278" y2="155" stroke="#334155" stroke-width="1.5" marker-start="url(#k)" marker-end="url(#k)"/>
  <text x="160" y="177" text-anchor="middle" font-size="17" fill="#334155">l₀</text>
  <!-- 2. bị kéo, y = 245, l = 300 px -->
  <text x="60" y="210" font-size="17" font-weight="700" fill="#0f172a">Biến dạng kéo: l &gt; l₀</text>
  <polyline points="40,245 60,245 73,233 99,257 125,233 151,257 177,233 203,257 229,233 255,257 281,233 307,257 320,245 332,245" fill="none" stroke="#334155" stroke-width="3"/>
  <rect x="332" y="225" width="16" height="40" fill="#64748b"/>
  <line x1="348" y1="245" x2="428" y2="245" stroke="#2563eb" stroke-width="4" marker-end="url(#b)"/>
  <text x="440" y="251" font-size="18" font-weight="700" fill="#2563eb">F kéo</text>
  <line x1="340" y1="275" x2="286" y2="275" stroke="#dc2626" stroke-width="4" marker-end="url(#r)"/>
  <text x="272" y="281" text-anchor="end" font-size="18" font-weight="700" fill="#dc2626">F<tspan font-size="13" dy="4">đh</tspan></text>
  <line x1="282" y1="297" x2="338" y2="297" stroke="#334155" stroke-width="1.5" marker-start="url(#k)" marker-end="url(#k)"/>
  <text x="350" y="303" font-size="17" fill="#334155">Δl &gt; 0</text>
  <!-- 3. bị nén, y = 370, l = 180 px -->
  <text x="60" y="335" font-size="17" font-weight="700" fill="#0f172a">Biến dạng nén: l &lt; l₀</text>
  <polyline points="40,370 60,370 67,358 81,382 95,358 109,382 123,358 137,382 151,358 165,382 179,358 193,382 200,370 212,370" fill="none" stroke="#334155" stroke-width="3"/>
  <rect x="212" y="350" width="16" height="40" fill="#64748b"/>
  <line x1="318" y1="370" x2="236" y2="370" stroke="#2563eb" stroke-width="4" marker-end="url(#b)"/>
  <text x="326" y="376" font-size="18" font-weight="700" fill="#2563eb">F nén</text>
  <line x1="228" y1="398" x2="282" y2="398" stroke="#dc2626" stroke-width="4" marker-end="url(#r)"/>
  <text x="292" y="404" font-size="18" font-weight="700" fill="#dc2626">F<tspan font-size="13" dy="4">đh</tspan></text>
  <line x1="222" y1="422" x2="278" y2="422" stroke="#334155" stroke-width="1.5" marker-start="url(#k)" marker-end="url(#k)"/>
  <text x="290" y="428" font-size="17" fill="#334155">Δl &lt; 0</text>
</svg>
