<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="420" fill="#ffffff"/>
  <text x="260" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Độ dịch chuyển góc và radian</text>
  <!-- tâm O (190, 230), r = 140 px; θ = 1 rad: B = (190 + 140·cos1, 230 − 140·sin1) = (265.64, 112.19) -->
  <circle cx="190" cy="230" r="140" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <line x1="190" y1="230" x2="330" y2="230" stroke="#2563eb" stroke-width="3"/>
  <line x1="190" y1="230" x2="265.64" y2="112.19" stroke="#2563eb" stroke-width="3"/>
  <path d="M330,230 A140,140 0 0 0 265.64,112.19" fill="none" stroke="#dc2626" stroke-width="5"/>
  <path d="M230,230 A40,40 0 0 0 211.61,196.34" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="236" y="214" font-size="18" font-weight="700" fill="#0f172a">θ</text>
  <text x="260" y="252" text-anchor="middle" font-size="18" font-weight="700" fill="#2563eb">r</text>
  <text x="216" y="164" text-anchor="end" font-size="18" font-weight="700" fill="#2563eb">r</text>
  <text x="334" y="160" font-size="20" font-weight="700" fill="#dc2626">s</text>
  <circle cx="190" cy="230" r="5" fill="#0f172a"/>
  <circle cx="330" cy="230" r="5" fill="#0f172a"/>
  <circle cx="265.64" cy="112.19" r="5" fill="#0f172a"/>
  <text x="176" y="252" font-size="18" font-weight="700" fill="#0f172a">O</text>
  <text x="338" y="250" font-size="18" font-weight="700" fill="#0f172a">A</text>
  <text x="270" y="102" font-size="18" font-weight="700" fill="#0f172a">B</text>
  <!-- công thức bên phải -->
  <text x="362" y="120" font-size="18" font-weight="700" fill="#0f172a">θ = s / r (rad)</text>
  <text x="362" y="160" font-size="16" fill="#0f172a">Khi s = r:</text>
  <text x="362" y="184" font-size="16" fill="#dc2626">θ = 1 rad ≈ 57,3°</text>
  <text x="362" y="290" font-size="16" fill="#0f172a">Cả vòng tròn:</text>
  <text x="362" y="314" font-size="16" fill="#0f172a">θ = 2π rad = 360°</text>
  <text x="362" y="346" font-size="16" font-weight="700" fill="#0f172a">π rad = 180°</text>
  <text x="260" y="400" text-anchor="middle" font-size="16" fill="#475569">Trên hình: cung AB dài bằng bán kính nên θ = 1 rad</text>
</svg>
