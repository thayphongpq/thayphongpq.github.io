<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 550" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="550" fill="#ffffff"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker>
  </defs>
  <text x="260" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Bố trí thí nghiệm đo gia tốc rơi tự do</text>
  <!-- đế và vít chỉnh -->
  <rect x="40" y="455" width="260" height="18" rx="3" fill="#94a3b8"/>
  <rect x="50" y="473" width="16" height="14" fill="#475569"/>
  <rect x="274" y="473" width="16" height="14" fill="#475569"/>
  <text x="312" y="470" font-size="16" fill="#0f172a">Đế có vít chỉnh</text>
  <!-- giá đỡ -->
  <rect x="110" y="70" width="12" height="385" fill="#64748b"/>
  <text x="130" y="440" font-size="16" fill="#0f172a">Giá đỡ</text>
  <!-- dây dọi -->
  <rect x="64" y="70" width="46" height="6" fill="#64748b"/>
  <line x1="70" y1="76" x2="70" y2="425" stroke="#334155" stroke-width="1.5"/>
  <path d="M62,425 L78,425 L70,445 z" fill="#b45309"/>
  <circle cx="70" cy="451" r="3" fill="#dc2626"/>
  <text x="56" y="250" transform="rotate(-90 56 250)" text-anchor="middle" font-size="16" fill="#0f172a">Dây dọi</text>
  <!-- nam châm điện và trụ thép -->
  <rect x="122" y="108" width="58" height="8" fill="#64748b"/>
  <rect x="180" y="98" width="40" height="32" rx="4" fill="#b91c1c"/>
  <rect x="192" y="130" width="16" height="30" rx="2" fill="#334155"/>
  <text x="200" y="90" text-anchor="middle" font-size="16" fill="#0f172a">Nam châm điện</text>
  <text x="216" y="156" font-size="16" fill="#0f172a">Trụ thép</text>
  <!-- công tắc -->
  <path d="M220,112 L310,112" fill="none" stroke="#0f172a" stroke-width="2"/>
  <rect x="310" y="96" width="100" height="34" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="360" y="119" text-anchor="middle" font-size="16" fill="#0f172a">Công tắc</text>
  <path d="M360,130 L360,190" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="368" y="166" font-size="16" fill="#0f172a">ổ A</text>
  <!-- đồng hồ hiện số -->
  <rect x="330" y="190" width="170" height="100" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="415" y="213" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Đồng hồ hiện số</text>
  <rect x="350" y="226" width="130" height="46" rx="4" fill="#0f172a"/>
  <text x="415" y="258" text-anchor="middle" font-size="26" font-family="Consolas, monospace" fill="#4ade80">0,404 s</text>
  <!-- đường rơi -->
  <line x1="200" y1="166" x2="200" y2="336" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#b)"/>
  <text x="208" y="250" font-size="16" fill="#2563eb">vật rơi</text>
  <!-- cổng quang điện -->
  <rect x="122" y="372" width="38" height="8" fill="#64748b"/>
  <rect x="160" y="344" width="16" height="34" rx="2" fill="#0369a1"/>
  <rect x="224" y="344" width="16" height="34" rx="2" fill="#0369a1"/>
  <rect x="160" y="372" width="80" height="6" fill="#0369a1"/>
  <line x1="176" y1="360" x2="224" y2="360" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="200" y="402" text-anchor="middle" font-size="16" fill="#0f172a">Cổng quang điện</text>
  <path d="M240,366 L460,366 L460,290" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="468" y="336" font-size="16" fill="#0f172a">ổ B</text>
  <!-- quãng đường s -->
  <line x1="138" y1="160" x2="192" y2="160" stroke="#0f172a" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="138" y1="360" x2="160" y2="360" stroke="#0f172a" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="145" y1="163" x2="145" y2="357" stroke="#0f172a" stroke-width="2" marker-start="url(#k)" marker-end="url(#k)"/>
  <text x="153" y="268" font-size="20" font-weight="700" fill="#0f172a">s</text>
  <!-- chú thích -->
  <text x="260" y="512" text-anchor="middle" font-size="16" fill="#475569">Bấm công tắc: nam châm nhả vật, đồng hồ bắt đầu đếm.</text>
  <text x="260" y="536" text-anchor="middle" font-size="16" fill="#475569">Vật chắn tia sáng ở cổng quang: đồng hồ dừng.</text>
</svg>
