<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="430" fill="#ffffff"/>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <text x="260" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Áp suất chất lỏng theo độ sâu</text>
  <!-- nước: mặt thoáng y = 120, đáy y = 380 -->
  <rect x="60" y="120" width="240" height="260" fill="#bfdbfe"/>
  <line x1="60" y1="120" x2="300" y2="120" stroke="#2563eb" stroke-width="2"/>
  <path d="M60,90 L60,380 L300,380 L300,90" fill="none" stroke="#334155" stroke-width="4"/>
  <!-- áp suất khí quyển -->
  <line x1="240" y1="62" x2="240" y2="116" stroke="#16a34a" stroke-width="4" marker-end="url(#g)"/>
  <text x="252" y="84" font-size="18" font-weight="700" fill="#16a34a">p<tspan font-size="13" dy="4">a</tspan></text>
  <!-- độ sâu h của điểm A (180,280) -->
  <line x1="110" y1="124" x2="110" y2="276" stroke="#334155" stroke-width="2" marker-start="url(#k)" marker-end="url(#k)"/>
  <text x="98" y="206" text-anchor="end" font-size="20" font-weight="700" font-style="italic" fill="#0f172a">h</text>
  <line x1="110" y1="280" x2="180" y2="280" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 4"/>
  <!-- áp suất tại A theo mọi hướng -->
  <g stroke="#dc2626" stroke-width="3">
    <line x1="180" y1="280" x2="180" y2="250" marker-end="url(#r)"/>
    <line x1="180" y1="280" x2="180" y2="310" marker-end="url(#r)"/>
    <line x1="180" y1="280" x2="150" y2="280" marker-end="url(#r)"/>
    <line x1="180" y1="280" x2="210" y2="280" marker-end="url(#r)"/>
  </g>
  <circle cx="180" cy="280" r="6" fill="#0f172a"/>
  <text x="190" y="270" font-size="19" font-weight="700" fill="#0f172a">A</text>
  <!-- áp lực lên thành bình tăng theo độ sâu -->
  <g stroke="#dc2626" stroke-width="3">
    <line x1="302" y1="160" x2="317" y2="160" marker-end="url(#r)"/>
    <line x1="302" y1="220" x2="332" y2="220" marker-end="url(#r)"/>
    <line x1="302" y1="280" x2="347" y2="280" marker-end="url(#r)"/>
    <line x1="302" y1="340" x2="362" y2="340" marker-end="url(#r)"/>
  </g>
  <!-- công thức -->
  <text x="378" y="150" font-size="16" fill="#0f172a">Mặt thoáng:</text>
  <text x="378" y="174" font-size="17" font-weight="700" fill="#16a34a">p = p<tspan font-size="12" dy="4">a</tspan></text>
  <text x="378" y="250" font-size="16" fill="#0f172a">Tại A:</text>
  <text x="378" y="276" font-size="18" font-weight="700" fill="#dc2626">p = p<tspan font-size="13" dy="4">a</tspan><tspan dy="-4"> + ρgh</tspan></text>
  <text x="260" y="414" text-anchor="middle" font-size="17" fill="#0f172a">Càng xuống sâu, áp suất chất lỏng càng lớn</text>
</svg>
