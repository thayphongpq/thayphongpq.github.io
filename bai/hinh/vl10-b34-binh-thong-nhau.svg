<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="420" fill="#ffffff"/>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <text x="260" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Bình thông nhau</text>
  <text x="260" y="58" text-anchor="middle" font-size="16" fill="#475569">Mặt thoáng ở các nhánh nằm trên cùng một mặt phẳng ngang</text>
  <!-- nước, mặt thoáng y = 150 -->
  <g fill="#bfdbfe">
    <rect x="80" y="330" width="350" height="40"/>
    <rect x="80" y="150" width="40" height="180"/>
    <polygon points="191.25,150 288.75,150 255,330 225,330"/>
    <polygon points="427.5,150 467.5,150 430,330 390,330"/>
  </g>
  <!-- thành bình -->
  <g stroke="#334155" stroke-width="4" fill="none" stroke-linecap="round">
    <line x1="80" y1="90" x2="80" y2="370"/>
    <line x1="120" y1="90" x2="120" y2="330"/>
    <line x1="80" y1="370" x2="430" y2="370"/>
    <line x1="430" y1="330" x2="430" y2="370"/>
    <line x1="120" y1="330" x2="225" y2="330"/>
    <line x1="255" y1="330" x2="390" y2="330"/>
    <line x1="180" y1="90" x2="225" y2="330"/>
    <line x1="300" y1="90" x2="255" y2="330"/>
    <line x1="390" y1="330" x2="440" y2="90"/>
    <line x1="430" y1="330" x2="480" y2="90"/>
  </g>
  <!-- mặt thoáng chung -->
  <line x1="40" y1="150" x2="505" y2="150" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 5"/>
  <!-- các điểm cùng độ sâu y = 300 -->
  <line x1="60" y1="300" x2="470" y2="300" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="100" cy="300" r="6" fill="#dc2626"/>
  <circle cx="240" cy="300" r="6" fill="#dc2626"/>
  <circle cx="416" cy="300" r="6" fill="#dc2626"/>
  <text x="100" y="288" text-anchor="middle" font-size="18" font-weight="700" fill="#dc2626">A</text>
  <text x="240" y="288" text-anchor="middle" font-size="18" font-weight="700" fill="#dc2626">B</text>
  <text x="416" y="288" text-anchor="middle" font-size="18" font-weight="700" fill="#dc2626">C</text>
  <!-- độ sâu h -->
  <line x1="150" y1="154" x2="150" y2="296" stroke="#334155" stroke-width="2" marker-start="url(#k)" marker-end="url(#k)"/>
  <text x="160" y="232" font-size="20" font-weight="700" font-style="italic" fill="#0f172a">h</text>
  <text x="260" y="404" text-anchor="middle" font-size="18" font-weight="700" fill="#dc2626">p<tspan font-size="13" dy="4">A</tspan><tspan dy="-4"> = p</tspan><tspan font-size="13" dy="4">B</tspan><tspan dy="-4"> = p</tspan><tspan font-size="13" dy="4">C</tspan><tspan dy="-4"> = p</tspan><tspan font-size="13" dy="4">a</tspan><tspan dy="-4"> + ρgh</tspan></text>
</svg>
