<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 490" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="490" fill="#ffffff"/>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <text x="260" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">So sánh công suất của hai máy</text>
  <!-- thẻ máy A -->
  <rect x="20" y="50" width="230" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="135" y="78" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Máy A</text>
  <line x1="40" y1="95" x2="110" y2="95" stroke="#334155" stroke-width="5"/>
  <circle cx="75" cy="104" r="9" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <line x1="75" y1="113" x2="75" y2="130" stroke="#334155" stroke-width="2"/>
  <rect x="58" y="130" width="34" height="28" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
  <rect x="58" y="222" width="34" height="28" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="35" y1="250" x2="125" y2="250" stroke="#334155" stroke-width="2"/>
  <line x1="112" y1="248" x2="112" y2="134" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>
  <text x="117" y="196" font-size="16" font-weight="700" fill="#16a34a">h</text>
  <g font-size="16" fill="#0f172a">
    <text x="138" y="115">m = 100 kg</text>
    <text x="138" y="140">h = 10 m</text>
    <text x="138" y="165">t = 20 s</text>
    <text x="138" y="195">A = 10 000 J</text>
    <text x="138" y="225" font-weight="700" fill="#c2410c">P = 500 W</text>
  </g>
  <!-- thẻ máy B -->
  <rect x="270" y="50" width="230" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="385" y="78" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Máy B</text>
  <line x1="290" y1="95" x2="360" y2="95" stroke="#334155" stroke-width="5"/>
  <circle cx="325" cy="104" r="9" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <line x1="325" y1="113" x2="325" y2="165" stroke="#334155" stroke-width="2"/>
  <rect x="303" y="165" width="44" height="30" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
  <rect x="303" y="220" width="44" height="30" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="285" y1="250" x2="375" y2="250" stroke="#334155" stroke-width="2"/>
  <line x1="357" y1="248" x2="357" y2="199" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>
  <text x="362" y="230" font-size="16" font-weight="700" fill="#16a34a">h</text>
  <g font-size="16" fill="#0f172a">
    <text x="388" y="115">m = 200 kg</text>
    <text x="388" y="140">h = 6 m</text>
    <text x="388" y="165">t = 30 s</text>
    <text x="388" y="195">A = 12 000 J</text>
    <text x="388" y="225" font-weight="700" fill="#c2410c">P = 400 W</text>
  </g>
  <!-- biểu đồ cột ngang -->
  <text x="20" y="306" font-size="16" font-weight="700" fill="#0f172a">Công thực hiện (J)</text>
  <rect x="90" y="316" width="250" height="18" fill="#2563eb"/>
  <rect x="90" y="341" width="300" height="18" fill="#2563eb"/>
  <text x="20" y="388" font-size="16" font-weight="700" fill="#0f172a">Công suất (W)</text>
  <rect x="90" y="398" width="300" height="18" fill="#c2410c"/>
  <rect x="90" y="423" width="240" height="18" fill="#c2410c"/>
  <g font-size="16" fill="#0f172a">
    <text x="20" y="330">Máy A</text>
    <text x="20" y="355">Máy B</text>
    <text x="20" y="412">Máy A</text>
    <text x="20" y="437">Máy B</text>
    <text x="346" y="330">10 000 J</text>
    <text x="396" y="355">12 000 J</text>
    <text x="396" y="412">500 W</text>
    <text x="336" y="437">400 W</text>
  </g>
  <text x="260" y="474" text-anchor="middle" font-size="16" fill="#475569">Máy B làm nhiều công hơn, nhưng máy A làm nhanh hơn</text>
</svg>
