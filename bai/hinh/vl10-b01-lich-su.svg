<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 640" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="640" fill="#ffffff"/>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <text x="260" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Ba giai đoạn phát triển của Vật lí</text>
  <line x1="28" y1="62" x2="28" y2="622" stroke="#334155" stroke-width="3" marker-end="url(#m)"/>
  <!-- 1 -->
  <rect x="48" y="60" width="452" height="44" rx="8" fill="#e2e8f0"/>
  <text x="62" y="89" font-size="21" font-weight="700" fill="#0f172a">1. Tiền Vật lí</text>
  <text x="488" y="89" text-anchor="end" font-size="16" fill="#475569">trước thế kỉ XVII</text>
  <g font-size="18" fill="#0f172a">
    <text x="62" y="130">• Quan sát, suy luận; chưa làm thí nghiệm</text>
    <text x="62" y="156">• Aristotle: “vật nặng rơi nhanh hơn</text>
    <text x="78" y="180">vật nhẹ” (quan niệm sai)</text>
  </g>
  <!-- 2 -->
  <rect x="48" y="210" width="452" height="44" rx="8" fill="#bfdbfe"/>
  <text x="62" y="239" font-size="21" font-weight="700" fill="#0f172a">2. Vật lí cổ điển</text>
  <text x="488" y="239" text-anchor="end" font-size="16" fill="#475569">thế kỉ XVII – cuối XIX</text>
  <g font-size="18" fill="#0f172a">
    <text x="62" y="280">• Galilei: phương pháp thực nghiệm</text>
    <text x="62" y="306">• Newton: các định luật chuyển động,</text>
    <text x="78" y="330">định luật vạn vật hấp dẫn</text>
    <text x="62" y="356">• Nhiệt động lực học; thuyết điện từ</text>
    <text x="78" y="380">của Maxwell</text>
  </g>
  <!-- 3 -->
  <rect x="48" y="410" width="452" height="44" rx="8" fill="#c4b5fd"/>
  <text x="62" y="439" font-size="21" font-weight="700" fill="#0f172a">3. Vật lí hiện đại</text>
  <text x="488" y="439" text-anchor="end" font-size="16" fill="#475569">cuối thế kỉ XIX – nay</text>
  <g font-size="18" fill="#0f172a">
    <text x="62" y="480">• Planck (1900): thuyết lượng tử</text>
    <text x="62" y="506">• Einstein (1905): thuyết tương đối</text>
    <text x="62" y="532">• Vật lí nguyên tử, hạt nhân, bán dẫn,</text>
    <text x="78" y="556">laser, máy tính...</text>
  </g>
  <text x="44" y="612" font-size="16" fill="#475569">thời gian</text>
</svg>
