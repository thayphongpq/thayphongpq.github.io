<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="480" fill="#ffffff"/>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <text x="260" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Độ dốc và diện tích dưới đồ thị v–t</text>
  <text x="260" y="60" text-anchor="middle" font-size="16" fill="#475569">v₀ = 2 m/s, a = 2 m/s²; xét 4 s đầu</text>
  <!-- vùng diện tích = độ dịch chuyển -->
  <polygon points="70,400 70,350 350,150 350,400" fill="#bbf7d0"/>
  <!-- lưới -->
  <g stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="70" y1="350" x2="440" y2="350"/><line x1="70" y1="300" x2="440" y2="300"/><line x1="70" y1="250" x2="440" y2="250"/>
    <line x1="70" y1="200" x2="440" y2="200"/><line x1="70" y1="150" x2="440" y2="150"/><line x1="70" y1="100" x2="440" y2="100"/>
    <line x1="140" y1="400" x2="140" y2="100"/><line x1="210" y1="400" x2="210" y2="100"/><line x1="280" y1="400" x2="280" y2="100"/>
    <line x1="350" y1="400" x2="350" y2="100"/><line x1="420" y1="400" x2="420" y2="100"/>
  </g>
  <!-- trục -->
  <line x1="70" y1="410" x2="70" y2="80" stroke="#334155" stroke-width="2.5" marker-end="url(#k)"/>
  <line x1="60" y1="400" x2="485" y2="400" stroke="#334155" stroke-width="2.5" marker-end="url(#k)"/>
  <text x="78" y="90" font-size="16" fill="#334155">v (m/s)</text>
  <text x="510" y="392" text-anchor="end" font-size="16" fill="#334155">t (s)</text>
  <g font-size="16" fill="#0f172a">
    <text x="62" y="420" text-anchor="end">0</text>
    <text x="62" y="356" text-anchor="end">2</text><text x="62" y="306" text-anchor="end">4</text><text x="62" y="256" text-anchor="end">6</text>
    <text x="62" y="206" text-anchor="end">8</text><text x="62" y="156" text-anchor="end">10</text><text x="62" y="106" text-anchor="end">12</text>
    <text x="140" y="422" text-anchor="middle">1</text><text x="210" y="422" text-anchor="middle">2</text><text x="280" y="422" text-anchor="middle">3</text>
    <text x="350" y="422" text-anchor="middle">4</text><text x="420" y="422" text-anchor="middle">5</text>
  </g>
  <!-- đồ thị v = 2 + 2t -->
  <line x1="70" y1="350" x2="420" y2="100" stroke="#2563eb" stroke-width="4"/>
  <circle cx="70" cy="350" r="5" fill="#2563eb"/><circle cx="350" cy="150" r="5" fill="#2563eb"/><circle cx="420" cy="100" r="5" fill="#2563eb"/>
  <!-- tam giác độ dốc -->
  <line x1="350" y1="150" x2="420" y2="150" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="420" y1="150" x2="420" y2="100" stroke="#dc2626" stroke-width="2.5"/>
  <text x="385" y="172" text-anchor="middle" font-size="16" fill="#dc2626">Δt = 1 s</text>
  <text x="428" y="130" font-size="16" fill="#dc2626">Δv = 2 m/s</text>
  <text x="362" y="205" font-size="16" font-weight="700" fill="#dc2626">Độ dốc = a</text>
  <text x="362" y="227" font-size="16" font-weight="700" fill="#dc2626">= 2 m/s²</text>
  <!-- diện tích -->
  <text x="210" y="330" text-anchor="middle" font-size="20" font-weight="700" fill="#166534">d = 24 m</text>
  <text x="210" y="354" text-anchor="middle" font-size="16" fill="#166534">(diện tích tô màu)</text>
  <text x="260" y="458" text-anchor="middle" font-size="17" fill="#0f172a">Diện tích hình thang: d = (2 + 10) · 4 / 2 = 24 m</text>
</svg>
