<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="500" fill="#ffffff"/>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
    <marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <text x="260" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Vật trượt trên mặt phẳng nghiêng</text>
  <text x="260" y="56" text-anchor="middle" font-size="16" fill="#475569">m = 2 kg, sin α = 0,6, μ = 0,25 → a = 4 m/s²</text>
  <!-- mặt phẳng nghiêng: tan α = 0,75; tỉ lệ lực 1 N = 8 px -->
  <polygon points="40,470 480,470 40,140" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <path d="M430,470 A50,50 0 0 1 440,440" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <text x="408" y="462" font-size="18" fill="#0f172a">α</text>
  <!-- hệ trục -->
  <line x1="420" y1="130" x2="460" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#k)"/>
  <line x1="420" y1="130" x2="450" y2="90" stroke="#334155" stroke-width="2" marker-end="url(#k)"/>
  <text x="466" y="172" font-size="16" fill="#334155">x</text>
  <text x="456" y="88" font-size="16" fill="#334155">y</text>
  <!-- vật -->
  <g transform="translate(245,262.5) rotate(36.87)">
    <rect x="-40" y="-25" width="80" height="50" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  </g>
  <!-- thành phần của P -->
  <g stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="245" y1="422.5" x2="321.8" y2="320.1"/>
    <line x1="245" y1="422.5" x2="168.2" y2="364.9"/>
  </g>
  <line x1="245" y1="262.5" x2="321.8" y2="320.1" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#x)"/>
  <line x1="245" y1="262.5" x2="168.2" y2="364.9" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#x)"/>
  <!-- các lực -->
  <line x1="245" y1="262.5" x2="245" y2="422.5" stroke="#dc2626" stroke-width="4" marker-end="url(#r)"/>
  <line x1="245" y1="262.5" x2="321.8" y2="160.1" stroke="#2563eb" stroke-width="4" marker-end="url(#b)"/>
  <line x1="198" y1="258.5" x2="172.4" y2="239.3" stroke="#ea580c" stroke-width="4" marker-end="url(#o)"/>
  <circle cx="245" cy="262.5" r="4" fill="#0f172a"/>
  <!-- nhãn -->
  <text x="253" y="442" font-size="20" font-weight="700" fill="#dc2626">P</text>
  <text x="330" y="168" font-size="20" font-weight="700" fill="#2563eb">N</text>
  <text x="146" y="214" font-size="20" font-weight="700" fill="#ea580c">F<tspan font-size="14" dy="5">ms</tspan></text>
  <text x="330" y="338" font-size="17" fill="#475569">P sin α</text>
  <text x="160" y="392" text-anchor="end" font-size="17" fill="#475569">P cos α</text>
</svg>
