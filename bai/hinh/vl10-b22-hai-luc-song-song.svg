<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="600" fill="#ffffff"/>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  </defs>
  <text x="260" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Tổng hợp hai lực song song cùng chiều</text>
  <text x="260" y="56" text-anchor="middle" font-size="16" fill="#475569">AB = 40 cm, OA = 15 cm, OB = 25 cm, P = 3,92 N</text>
  <!-- tỉ lệ: 1 cm = 10 px; lực 1 N = 50 px (F1 = 2,45 N, F2 = 1,47 N theo lí thuyết) -->
  <rect x="30" y="76" width="460" height="10" fill="#475569"/>
  <!-- lực kế 1 và 2 -->
  <line x1="60" y1="86" x2="60" y2="100" stroke="#475569" stroke-width="2"/>
  <rect x="48" y="100" width="24" height="60" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <line x1="60" y1="160" x2="60" y2="320" stroke="#475569" stroke-width="2"/>
  <line x1="460" y1="86" x2="460" y2="100" stroke="#475569" stroke-width="2"/>
  <rect x="448" y="100" width="24" height="60" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <line x1="460" y1="160" x2="460" y2="320" stroke="#475569" stroke-width="2"/>
  <text x="80" y="135" font-size="16" fill="#b45309">Lực kế 1</text>
  <text x="440" y="135" text-anchor="end" font-size="16" fill="#b45309">Lực kế 2</text>
  <!-- thước AB -->
  <rect x="50" y="314" width="420" height="12" fill="#fcd34d" stroke="#92400e" stroke-width="2"/>
  <text x="42" y="326" text-anchor="end" font-size="18" font-weight="700" fill="#0f172a">A</text>
  <text x="478" y="326" font-size="18" font-weight="700" fill="#0f172a">B</text>
  <text x="222" y="306" font-size="18" font-weight="700" fill="#0f172a">O</text>
  <!-- lực -->
  <line x1="60" y1="320" x2="60" y2="198" stroke="#2563eb" stroke-width="4" marker-end="url(#b)"/>
  <text x="72" y="250" font-size="20" font-weight="700" fill="#2563eb">F₁</text>
  <line x1="460" y1="320" x2="460" y2="246" stroke="#16a34a" stroke-width="4" marker-end="url(#g)"/>
  <text x="448" y="290" text-anchor="end" font-size="20" font-weight="700" fill="#16a34a">F₂</text>
  <line x1="210" y1="326" x2="210" y2="525" stroke="#475569" stroke-width="2"/>
  <line x1="210" y1="320" x2="210" y2="516" stroke="#dc2626" stroke-width="4" marker-end="url(#r)"/>
  <text x="222" y="450" font-size="18" font-weight="700" fill="#dc2626">P = 3,92 N</text>
  <rect x="195" y="525" width="30" height="50" rx="3" fill="#64748b"/>
  <text x="235" y="555" font-size="16" fill="#0f172a">8 quả × 50 g</text>
  <!-- khoảng cách -->
  <g stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="60" y1="328" x2="60" y2="362"/>
    <line x1="460" y1="328" x2="460" y2="362"/>
  </g>
  <line x1="62" y1="352" x2="208" y2="352" stroke="#334155" stroke-width="2" marker-start="url(#k)" marker-end="url(#k)"/>
  <line x1="212" y1="352" x2="458" y2="352" stroke="#334155" stroke-width="2" marker-start="url(#k)" marker-end="url(#k)"/>
  <text x="135" y="378" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">d₁ = 15 cm</text>
  <text x="335" y="378" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">d₂ = 25 cm</text>
  <text x="40" y="440" font-size="18" fill="#0f172a">F₁ + F₂ = P</text>
  <text x="40" y="470" font-size="18" fill="#0f172a">F₁·d₁ = F₂·d₂</text>
</svg>
