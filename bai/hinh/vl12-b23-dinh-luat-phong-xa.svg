  <line x1="70" y1="280" x2="70" y2="18" stroke="#0f172a" stroke-width="2" marker-end="url(#m)"/>
  <text x="528" y="304" font-size="20" font-style="italic" fill="#0f172a">t</text>
  <text x="80" y="26" font-size="20" font-style="italic" fill="#0f172a">N</text>
  <text x="62" y="300" text-anchor="end" font-size="18" fill="#0f172a">O</text>
  <!-- mốc N0, N0/2, N0/4, N0/8 -->
  <line x1="66" y1="160" x2="160" y2="160" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="160" y1="160" x2="160" y2="280" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
