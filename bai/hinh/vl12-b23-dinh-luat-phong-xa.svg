  <line x1="250" y1="220" x2="250" y2="280" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="66" y1="250" x2="340" y2="250" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="340" y1="250" x2="340" y2="280" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="62" y="46" text-anchor="end" font-size="17" fill="#0f172a">N₀</text>
  <text x="62" y="166" text-anchor="end" font-size="17" fill="#0f172a">N₀/2</text>
  <text x="62" y="222" text-anchor="end" font-size="15" fill="#0f172a">N₀/4</text>
  <text x="62" y="252" text-anchor="end" font-size="13" fill="#0f172a">N₀/8</text>
  <text x="160" y="302" text-anchor="middle" font-size="17" font-style="italic" fill="#0f172a">T</text>
  <text x="250" y="302" text-anchor="middle" font-size="17" font-style="italic" fill="#0f172a">2T</text>
  <text x="340" y="302" text-anchor="middle" font-size="17" font-style="italic" fill="#0f172a">3T</text>
  <polyline points="70,40 85,66.2 100,89.5 115,110.3 130,128.8 145,145.3 160,160 175,173.1 190,184.8 205,195.1 220,204.4 235,212.7 250,220 265,226.5 280,232.4 295,237.6 310,242.2 325,246.3 340,250 355,253.3 370,256.2 385,258.8 400,261.1 415,263.2 430,265 445,266.6 460,268.1 475,269.4 490,270.6 505,271.6 520,272.5" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linejoin="round"/>
  <circle cx="160" cy="160" r="5" fill="#0f172a"/>
  <circle cx="250" cy="220" r="5" fill="#0f172a"/>
  <circle cx="340" cy="250" r="5" fill="#0f172a"/>
  <text x="380" y="110" text-anchor="middle" font-size="19" font-style="italic" fill="#0f172a">N = N₀ · 2^(−t/T)</text>
