<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="420" fill="#ffffff"/>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <text x="260" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Va chạm mềm của hai xe</text>
  <!-- tỉ lệ vận tốc: 1 m/s = 30 px -->
  <!-- TRƯỚC VA CHẠM -->
  <text x="20" y="72" font-size="18" font-weight="700" fill="#0f172a">Trước va chạm</text>
  <line x1="20" y1="175" x2="500" y2="175" stroke="#334155" stroke-width="3"/>
  <rect x="60" y="112" width="110" height="46" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <rect x="170" y="125" width="6" height="20" fill="#64748b"/>
  <circle cx="85" cy="167" r="8" fill="#334155"/>
  <circle cx="145" cy="167" r="8" fill="#334155"/>
  <text x="115" y="141" text-anchor="middle" font-size="16" fill="#0f172a">m₁ = 2 kg</text>
  <line x1="90" y1="95" x2="180" y2="95" stroke="#dc2626" stroke-width="4" marker-end="url(#r)"/>
  <text x="190" y="101" font-size="17" font-weight="700" fill="#dc2626">v₁ = 3 m/s</text>
  <rect x="330" y="112" width="90" height="46" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <rect x="324" y="125" width="6" height="20" fill="#64748b"/>
  <circle cx="352" cy="167" r="8" fill="#334155"/>
  <circle cx="398" cy="167" r="8" fill="#334155"/>
  <text x="375" y="141" text-anchor="middle" font-size="16" fill="#0f172a">m₂ = 1 kg</text>
  <text x="375" y="98" text-anchor="middle" font-size="16" fill="#475569">đứng yên</text>
  <line x1="20" y1="200" x2="500" y2="200" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 5"/>
  <!-- SAU VA CHẠM -->
  <text x="20" y="232" font-size="18" font-weight="700" fill="#0f172a">Sau va chạm: hai xe dính vào nhau</text>
  <line x1="20" y1="330" x2="500" y2="330" stroke="#334155" stroke-width="3"/>
  <rect x="120" y="272" width="110" height="46" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <rect x="230" y="285" width="6" height="20" fill="#64748b"/>
  <rect x="236" y="272" width="90" height="46" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <circle cx="145" cy="322" r="8" fill="#334155"/>
  <circle cx="205" cy="322" r="8" fill="#334155"/>
  <circle cx="258" cy="322" r="8" fill="#334155"/>
  <circle cx="304" cy="322" r="8" fill="#334155"/>
  <text x="175" y="301" text-anchor="middle" font-size="16" fill="#0f172a">2 kg</text>
  <text x="281" y="301" text-anchor="middle" font-size="16" fill="#0f172a">1 kg</text>
  <line x1="190" y1="255" x2="250" y2="255" stroke="#16a34a" stroke-width="4" marker-end="url(#g)"/>
  <text x="262" y="261" font-size="17" font-weight="700" fill="#16a34a">v = 2 m/s</text>
  <!-- tính toán -->
  <text x="260" y="370" text-anchor="middle" font-size="16" fill="#0f172a">p = 2·3 + 1·0 = 6 kg·m/s ⇒ v = 6 : (2 + 1) = 2 m/s</text>
  <text x="260" y="398" text-anchor="middle" font-size="16" fill="#0f172a">Động năng: 9 J → 6 J (giảm 3 J)</text>
</svg>
