<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="430" fill="#ffffff"/>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  </defs>
  <text x="260" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Các lực tác dụng lên thùng hàng</text>
  <text x="260" y="56" text-anchor="middle" font-size="16" fill="#475569">m = 50 kg; lực ngang: 1 N = 1 px</text>
  <!-- sàn -->
  <rect x="20" y="260" width="480" height="14" fill="#e2e8f0"/>
  <line x1="20" y1="260" x2="500" y2="260" stroke="#334155" stroke-width="2"/>
  <!-- thùng hàng, tâm (250, 220) -->
  <rect x="200" y="180" width="100" height="80" rx="4" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
  <text x="224" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">50 kg</text>
  <!-- N (lên) và P (xuống), cùng độ lớn 500 N -->
  <line x1="250" y1="220" x2="250" y2="100" stroke="#16a34a" stroke-width="4" marker-end="url(#n)"/>
  <text x="260" y="112" font-size="19" font-weight="700" fill="#16a34a">N = 500 N</text>
  <line x1="250" y1="220" x2="250" y2="340" stroke="#b45309" stroke-width="4" marker-end="url(#p)"/>
  <text x="260" y="336" font-size="19" font-weight="700" fill="#b45309">P = 500 N</text>
  <!-- lực kéo F = 150 N -->
  <line x1="300" y1="220" x2="450" y2="220" stroke="#dc2626" stroke-width="5" marker-end="url(#r)"/>
  <text x="375" y="208" text-anchor="middle" font-size="19" font-weight="700" fill="#dc2626">F = 150 N</text>
  <!-- lực ma sát 50 N -->
  <line x1="200" y1="252" x2="150" y2="252" stroke="#ea580c" stroke-width="5" marker-end="url(#o)"/>
  <text x="140" y="246" text-anchor="end" font-size="19" font-weight="700" fill="#ea580c">F<tspan font-size="13" dy="5">ms</tspan><tspan dy="-5"> = 50 N</tspan></text>
  <circle cx="250" cy="220" r="4" fill="#0f172a"/>
  <!-- hợp lực và gia tốc -->
  <line x1="40" y1="372" x2="140" y2="372" stroke="#dc2626" stroke-width="5" marker-end="url(#r)"/>
  <text x="152" y="378" font-size="17" font-weight="700" fill="#dc2626">Hợp lực: 150 − 50 = 100 N</text>
  <line x1="40" y1="408" x2="80" y2="408" stroke="#2563eb" stroke-width="4" marker-end="url(#b)"/>
  <text x="152" y="414" font-size="17" font-weight="700" fill="#2563eb">a = 100 : 50 = 2 m/s²</text>
</svg>
