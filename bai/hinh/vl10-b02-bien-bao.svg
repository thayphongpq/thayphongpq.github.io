<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="600" fill="#ffffff"/>
  <text x="260" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Bốn loại biển báo</text>
  <!-- Biển cấm -->
  <g transform="translate(130,135)">
    <circle r="62" fill="#fff" stroke="#dc2626" stroke-width="12"/>
    <path d="M0,-32 C14,-14 22,0 18,16 C15,30 -15,30 -18,16 C-22,0 -8,-8 0,-32 Z" fill="#111827"/>
    <line x1="-42" y1="-42" x2="42" y2="42" stroke="#dc2626" stroke-width="12"/>
  </g>
  <!-- Biển cảnh báo -->
  <g transform="translate(390,140)">
    <path d="M0,-66 L70,56 L-70,56 Z" fill="#facc15" stroke="#111827" stroke-width="8" stroke-linejoin="round"/>
    <path d="M6,-32 L-14,10 L2,10 L-6,40 L16,-4 L0,-4 Z" fill="#111827"/>
  </g>
  <!-- Biển bắt buộc -->
  <g transform="translate(130,405)">
    <circle r="66" fill="#1d4ed8"/>
    <rect x="-42" y="-14" width="36" height="26" rx="10" fill="#fff"/>
    <rect x="6" y="-14" width="36" height="26" rx="10" fill="#fff"/>
    <rect x="-8" y="-6" width="16" height="6" fill="#fff"/>
    <line x1="-42" y1="-4" x2="-56" y2="-12" stroke="#fff" stroke-width="5"/>
    <line x1="42" y1="-4" x2="56" y2="-12" stroke="#fff" stroke-width="5"/>
  </g>
  <!-- Biển chỉ dẫn -->
  <g transform="translate(390,405)">
    <rect x="-75" y="-55" width="150" height="110" rx="6" fill="#16a34a"/>
    <circle cx="-22" cy="-30" r="10" fill="#fff"/>
    <path d="M-24,-17 L-32,13 M-28,-6 L-6,-10 M-30,9 L-15,35 M-32,13 L-52,28 M-26,-15 L-48,-4" stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M18,0 L54,0 M41,-13 L55,0 L41,13" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <g font-size="21" font-weight="700" text-anchor="middle" fill="#0f172a">
    <text x="130" y="232">Biển cấm</text>
    <text x="390" y="232">Biển cảnh báo</text>
    <text x="130" y="503">Biển bắt buộc</text>
    <text x="390" y="503">Biển chỉ dẫn</text>
  </g>
  <g font-size="17" text-anchor="middle" fill="#475569">
    <text x="130" y="258">tròn, viền đỏ, gạch chéo</text>
    <text x="130" y="280">(cấm lửa)</text>
    <text x="390" y="258">tam giác vàng, viền đen</text>
    <text x="390" y="280">(điện áp cao)</text>
    <text x="130" y="529">tròn, nền xanh lam</text>
    <text x="130" y="551">(đeo kính bảo hộ)</text>
    <text x="390" y="529">chữ nhật, nền xanh lá</text>
    <text x="390" y="551">(lối thoát hiểm)</text>
  </g>
  <line x1="260" y1="60" x2="260" y2="570" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="20" y1="310" x2="500" y2="310" stroke="#e2e8f0" stroke-width="2"/>
</svg>
