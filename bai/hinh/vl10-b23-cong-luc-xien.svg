<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 395" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="395" fill="#ffffff"/>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/></marker>
  </defs>
  <text x="260" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Công của lực kéo xiên góc</text>
  <text x="260" y="58" text-anchor="middle" font-size="16" fill="#475569">F = 50 N, α = 60°, s = 10 m</text>
  <!-- sàn -->
  <rect x="20" y="280" width="480" height="12" fill="#e2e8f0"/>
  <line x1="20" y1="280" x2="500" y2="280" stroke="#334155" stroke-width="2"/>
  <!-- vị trí đầu (nét đứt) và vị trí cuối -->
  <rect x="50" y="220" width="80" height="60" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="90" y="256" text-anchor="middle" font-size="15" fill="#64748b">lúc đầu</text>
  <rect x="330" y="220" width="80" height="60" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
  <text x="370" y="256" text-anchor="middle" font-size="15" fill="#7c2d12">lúc sau</text>
  <!-- thành phần của F -->
  <g stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="475" y1="107.4" x2="475" y2="220"/>
    <line x1="410" y1="107.4" x2="475" y2="107.4"/>
  </g>
  <line x1="410" y1="220" x2="475" y2="220" stroke="#16a34a" stroke-width="3.5" marker-end="url(#g)"/>
  <line x1="410" y1="220" x2="410" y2="107.4" stroke="#9333ea" stroke-width="3.5" marker-end="url(#p)"/>
  <line x1="410" y1="220" x2="475" y2="107.4" stroke="#dc2626" stroke-width="4" marker-end="url(#r)"/>
  <path d="M440,220 A30,30 0 0 0 425,194.02" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <text x="444" y="208" font-size="17" fill="#0f172a">α</text>
  <text x="484" y="118" font-size="20" font-weight="700" fill="#dc2626">F</text>
  <text x="402" y="170" text-anchor="end" font-size="16" font-weight="700" fill="#9333ea">F sin α</text>
  <text x="444" y="245" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">F cos α</text>
  <!-- độ dịch chuyển -->
  <g stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="90" y1="294" x2="90" y2="322"/>
    <line x1="370" y1="294" x2="370" y2="322"/>
  </g>
  <line x1="90" y1="314" x2="368" y2="314" stroke="#2563eb" stroke-width="3" marker-end="url(#k)"/>
  <text x="230" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#2563eb">s = 10 m</text>
  <text x="260" y="378" text-anchor="middle" font-size="18" fill="#0f172a">A = F s cos α = 50 · 10 · cos 60° = 250 J</text>
</svg>
