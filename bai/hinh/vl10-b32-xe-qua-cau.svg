<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="400" fill="#ffffff"/>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/></marker>
  </defs>
  <text x="260" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Ô tô qua cầu vồng lên</text>
  <text x="260" y="58" text-anchor="middle" font-size="16" fill="#475569">m = 1200 kg, v = 10 m/s, r = 50 m, g = 10 m/s²</text>
  <!-- cầu: cung tròn tâm (260,560), bán kính 340 px, đỉnh (260,220) -->
  <path d="M41,300 A340,340 0 0 1 479,300 Z" fill="#e2e8f0"/>
  <path d="M41,300 A340,340 0 0 1 479,300" fill="none" stroke="#64748b" stroke-width="6"/>
  <line x1="10" y1="300" x2="510" y2="300" stroke="#64748b" stroke-width="3"/>
  <!-- ô tô ở đỉnh cầu -->
  <rect x="222" y="186" width="76" height="24" rx="6" fill="#facc15" stroke="#0f172a" stroke-width="2"/>
  <path d="M236,186 L246,170 L276,170 L286,186" fill="#fde68a" stroke="#0f172a" stroke-width="2"/>
  <circle cx="240" cy="212" r="7" fill="#0f172a"/>
  <circle cx="280" cy="212" r="7" fill="#0f172a"/>
  <!-- lực: P = 12000 N (100 px), N = 9600 N (80 px) -->
  <line x1="254" y1="198" x2="254" y2="298" stroke="#dc2626" stroke-width="4" marker-end="url(#r)"/>
  <text x="244" y="290" text-anchor="end" font-size="20" font-weight="700" fill="#dc2626">P</text>
  <line x1="266" y1="198" x2="266" y2="118" stroke="#16a34a" stroke-width="4" marker-end="url(#g)"/>
  <text x="276" y="130" font-size="20" font-weight="700" fill="#16a34a">N</text>
  <!-- gia tốc hướng tâm -->
  <line x1="370" y1="160" x2="370" y2="215" stroke="#9333ea" stroke-width="4" marker-end="url(#p)"/>
  <text x="382" y="190" font-size="18" font-weight="700" fill="#9333ea">a<tspan font-size="13" dy="4">ht</tspan></text>
  <text x="382" y="214" font-size="15" fill="#9333ea">hướng về tâm cầu</text>
  <!-- chú thích -->
  <text x="260" y="340" text-anchor="middle" font-size="17" fill="#0f172a">Hợp lực hướng vào tâm: P − N = mv²/r</text>
  <text x="260" y="368" text-anchor="middle" font-size="17" fill="#0f172a">⇒ N = m(g − v²/r) = 9600 N &lt; P = 12000 N</text>
</svg>
