<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="400" fill="#ffffff"/>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <text x="260" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Bố trí thí nghiệm va chạm trên ray</text>
  <text x="260" y="62" text-anchor="middle" font-size="16" fill="#475569">Tấm chắn sáng rộng d = 10,0 mm</text>
  <text x="260" y="86" text-anchor="middle" font-size="16" fill="#475569">v = d / t (t: thời gian tấm chắn che cổng quang)</text>
  <!-- ray -->
  <rect x="20" y="230" width="480" height="14" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <text x="495" y="222" text-anchor="end" font-size="15" fill="#475569">Ray trượt</text>
  <!-- cổng quang 1 -->
  <path d="M158,236 L158,150 L182,150 L182,236" fill="none" stroke="#7c3aed" stroke-width="5"/>
  <line x1="158" y1="180" x2="182" y2="180" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="170" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed">Cổng quang 1</text>
  <!-- cổng quang 2 -->
  <path d="M338,236 L338,150 L362,150 L362,236" fill="none" stroke="#7c3aed" stroke-width="5"/>
  <line x1="338" y1="180" x2="362" y2="180" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="350" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed">Cổng quang 2</text>
  <!-- xe 1 -->
  <rect x="40" y="198" width="80" height="30" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <rect x="75" y="166" width="10" height="32" fill="#0f172a"/>
  <rect x="120" y="203" width="6" height="20" fill="#f59e0b"/>
  <text x="80" y="219" text-anchor="middle" font-size="14" fill="#0f172a">Xe 1 (m₁)</text>
  <line x1="50" y1="264" x2="118" y2="264" stroke="#dc2626" stroke-width="4" marker-end="url(#r)"/>
  <text x="126" y="270" font-size="17" font-weight="700" fill="#dc2626">v₁</text>
  <!-- xe 2 -->
  <rect x="225" y="198" width="80" height="30" rx="4" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <rect x="260" y="166" width="10" height="32" fill="#0f172a"/>
  <text x="265" y="219" text-anchor="middle" font-size="14" fill="#0f172a">Xe 2 (m₂)</text>
  <text x="265" y="266" text-anchor="middle" font-size="15" fill="#475569">đứng yên</text>
  <!-- dây nối -->
  <path d="M170,246 L170,282 L215,282 L215,300" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M350,246 L350,282 L305,282 L305,300" fill="none" stroke="#475569" stroke-width="2"/>
  <!-- đồng hồ -->
  <rect x="170" y="300" width="180" height="60" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <rect x="190" y="312" width="140" height="30" rx="3" fill="#0f172a"/>
  <text x="260" y="334" text-anchor="middle" font-size="20" font-weight="700" fill="#22c55e">0,0200 s</text>
  <text x="260" y="384" text-anchor="middle" font-size="15" fill="#0f172a">Đồng hồ đo thời gian hiện số</text>
</svg>
