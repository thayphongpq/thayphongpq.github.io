<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 545" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="545" fill="#ffffff"/>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <text x="260" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Ảnh hoạt nghiệm vật rơi tự do</text>
  <text x="260" y="60" text-anchor="middle" font-size="16" fill="#475569">Các lần chụp cách nhau 1 s; lấy g = 10 m/s²</text>
  <!-- thước đo: 1 m = 8 px, h = 0 tại y = 100 -->
  <text x="120" y="88" text-anchor="middle" font-size="16" fill="#334155">h (m)</text>
  <line x1="120" y1="100" x2="120" y2="460" stroke="#334155" stroke-width="2"/>
  <g stroke="#334155" stroke-width="2">
    <line x1="114" y1="100" x2="126" y2="100"/><line x1="114" y1="140" x2="126" y2="140"/><line x1="114" y1="180" x2="126" y2="180"/>
    <line x1="114" y1="220" x2="126" y2="220"/><line x1="114" y1="260" x2="126" y2="260"/><line x1="114" y1="300" x2="126" y2="300"/>
    <line x1="114" y1="340" x2="126" y2="340"/><line x1="114" y1="380" x2="126" y2="380"/><line x1="114" y1="420" x2="126" y2="420"/>
    <line x1="114" y1="460" x2="126" y2="460"/>
  </g>
  <g font-size="16" fill="#0f172a" text-anchor="end">
    <text x="108" y="105">0</text><text x="108" y="145">5</text><text x="108" y="185">10</text><text x="108" y="225">15</text>
    <text x="108" y="265">20</text><text x="108" y="305">25</text><text x="108" y="345">30</text><text x="108" y="385">35</text>
    <text x="108" y="425">40</text><text x="108" y="465">45</text>
  </g>
  <!-- gia tốc g -->
  <line x1="50" y1="220" x2="50" y2="320" stroke="#dc2626" stroke-width="4" marker-end="url(#r)"/>
  <text x="40" y="276" text-anchor="end" font-size="20" font-weight="700" fill="#dc2626">g</text>
  <!-- đường rơi và các vị trí -->
  <line x1="200" y1="100" x2="200" y2="460" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 5"/>
  <g stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3 4">
    <line x1="126" y1="100" x2="188" y2="100"/><line x1="126" y1="140" x2="188" y2="140"/>
    <line x1="126" y1="260" x2="188" y2="260"/><line x1="126" y1="460" x2="188" y2="460"/>
  </g>
  <circle cx="200" cy="100" r="12" fill="#f97316" fill-opacity="0.4"/>
  <circle cx="200" cy="140" r="12" fill="#f97316" fill-opacity="0.6"/>
  <circle cx="200" cy="260" r="12" fill="#f97316" fill-opacity="0.8"/>
  <circle cx="200" cy="460" r="12" fill="#f97316"/>
  <g font-size="17" fill="#0f172a">
    <text x="230" y="106">t = 0 s: h = 0</text>
    <text x="230" y="146">t = 1 s: h = 5 m</text>
    <text x="230" y="266">t = 2 s: h = 20 m</text>
    <text x="230" y="466">t = 3 s: h = 45 m</text>
  </g>
  <!-- quãng đường từng giây -->
  <g stroke="#2563eb" stroke-width="2.5" fill="none">
    <path d="M432,102 L440,102 L440,138 L432,138"/>
    <path d="M432,142 L440,142 L440,258 L432,258"/>
    <path d="M432,262 L440,262 L440,458 L432,458"/>
  </g>
  <g font-size="17" font-weight="700" fill="#2563eb">
    <text x="450" y="126">5 m</text>
    <text x="450" y="206">15 m</text>
    <text x="450" y="366">25 m</text>
  </g>
  <text x="260" y="502" text-anchor="middle" font-size="16" fill="#0f172a">Quãng đường từng giây: 5 m, 15 m, 25 m</text>
  <text x="260" y="528" text-anchor="middle" font-size="16" fill="#0f172a">Hiệu không đổi 10 m: rơi nhanh dần đều</text>
</svg>
