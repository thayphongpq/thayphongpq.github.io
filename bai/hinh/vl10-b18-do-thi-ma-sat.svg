<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="400" fill="#ffffff"/>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <text x="260" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Lực ma sát khi tăng dần lực kéo</text>
  <text x="260" y="60" text-anchor="middle" font-size="16" fill="#475569">Hộp 5 kg trên sàn ngang, μ = 0,2, lực kéo F nằm ngang</text>
  <!-- gốc (70,330); trục F: 20 px = 1 N; trục F_ms: 15 px = 1 N -->
  <line x1="60" y1="330" x2="495" y2="330" stroke="#334155" stroke-width="2" marker-end="url(#k)"/>
  <line x1="70" y1="340" x2="70" y2="85" stroke="#334155" stroke-width="2" marker-end="url(#k)"/>
  <text x="495" y="318" text-anchor="end" font-size="16" fill="#334155">F (N)</text>
  <text x="80" y="95" font-size="16" fill="#334155">F<tspan font-size="12" dy="4">ms</tspan><tspan dy="-4"> (N)</tspan></text>
  <!-- vạch chia trục F -->
  <g stroke="#334155" stroke-width="2">
    <line x1="170" y1="330" x2="170" y2="336"/><line x1="270" y1="330" x2="270" y2="336"/>
    <line x1="310" y1="330" x2="310" y2="336"/><line x1="370" y1="330" x2="370" y2="336"/><line x1="470" y1="330" x2="470" y2="336"/>
  </g>
  <g font-size="15" fill="#334155" text-anchor="middle">
    <text x="170" y="353">5</text><text x="270" y="353">10</text><text x="310" y="353">12</text><text x="370" y="353">15</text><text x="470" y="353">20</text>
  </g>
  <text x="62" y="348" text-anchor="end" font-size="15" fill="#334155">0</text>
  <!-- đường gióng -->
  <g stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="70" y1="150" x2="310" y2="150"/>
    <line x1="310" y1="150" x2="310" y2="330"/>
    <line x1="70" y1="180" x2="322" y2="180"/>
  </g>
  <text x="62" y="155" text-anchor="end" font-size="15" fill="#334155">12</text>
  <text x="62" y="185" text-anchor="end" font-size="15" fill="#334155">10</text>
  <!-- ma sát nghỉ: F_msn = F (tăng đến 12 N) -->
  <line x1="70" y1="330" x2="310" y2="150" stroke="#2563eb" stroke-width="4"/>
  <circle cx="310" cy="150" r="5" fill="#0f172a"/>
  <text x="310" y="132" text-anchor="middle" font-size="16" fill="#0f172a">Ma sát nghỉ cực đại 12 N</text>
  <text x="175" y="285" font-size="17" font-weight="700" fill="#2563eb">Ma sát nghỉ</text>
  <text x="175" y="307" font-size="16" fill="#2563eb">(vật đứng yên)</text>
  <!-- ma sát trượt: 10 N không đổi -->
  <polyline points="310,150 322,180 470,180" fill="none" stroke="#dc2626" stroke-width="4"/>
  <text x="400" y="168" text-anchor="middle" font-size="17" font-weight="700" fill="#dc2626">Ma sát trượt</text>
  <text x="400" y="206" text-anchor="middle" font-size="16" fill="#dc2626">F<tspan font-size="12" dy="4">mst</tspan><tspan dy="-4"> = μN = 10 N</tspan></text>
  <text x="260" y="385" text-anchor="middle" font-size="16" fill="#0f172a">Vật bắt đầu trượt khi F vượt quá 12 N</text>
</svg>
