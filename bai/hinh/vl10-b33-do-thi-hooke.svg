<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="400" fill="#ffffff"/>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <text x="260" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Đồ thị định luật Hooke</text>
  <!-- gốc O (80,330); 1 cm = 50 px; 1 N = 75 px -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="80" y1="255" x2="480" y2="255"/>
    <line x1="80" y1="180" x2="480" y2="180"/>
    <line x1="80" y1="105" x2="480" y2="105"/>
    <line x1="180" y1="70" x2="180" y2="330"/>
    <line x1="280" y1="70" x2="280" y2="330"/>
    <line x1="380" y1="70" x2="380" y2="330"/>
    <line x1="480" y1="70" x2="480" y2="330"/>
  </g>
  <line x1="80" y1="330" x2="502" y2="330" stroke="#334155" stroke-width="2" marker-end="url(#k)"/>
  <line x1="80" y1="330" x2="80" y2="58" stroke="#334155" stroke-width="2" marker-end="url(#k)"/>
  <text x="90" y="66" font-size="16" fill="#334155">F<tspan font-size="12" dy="4">đh</tspan><tspan dy="-4"> (N)</tspan></text>
  <text x="500" y="380" text-anchor="end" font-size="16" fill="#334155">Δl (cm)</text>
  <text x="70" y="350" text-anchor="end" font-size="16" fill="#334155">O</text>
  <g font-size="15" fill="#334155" text-anchor="middle">
    <text x="130" y="350">1</text><text x="180" y="350">2</text><text x="230" y="350">3</text><text x="280" y="350">4</text>
    <text x="330" y="350">5</text><text x="380" y="350">6</text><text x="430" y="350">7</text><text x="480" y="350">8</text>
  </g>
  <g font-size="15" fill="#334155" text-anchor="end">
    <text x="72" y="260">1</text><text x="72" y="185">2</text><text x="72" y="110">3</text>
  </g>
  <!-- lò xo (1): k = 100 N/m, 3 N ứng với 3 cm -->
  <line x1="80" y1="330" x2="230" y2="105" stroke="#dc2626" stroke-width="3"/>
  <text x="240" y="100" font-size="16" font-weight="700" fill="#dc2626">(1) k = 100 N/m</text>
  <!-- lò xo (2): k = 50 N/m, thẳng đến giới hạn đàn hồi 2,5 N ứng với 5 cm -->
  <line x1="80" y1="330" x2="330" y2="142.5" stroke="#2563eb" stroke-width="3"/>
  <path d="M330,142.5 Q390,112 470,106" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="7 5"/>
  <g fill="#2563eb">
    <circle cx="130" cy="292.5" r="5"/><circle cx="180" cy="255" r="5"/><circle cx="230" cy="217.5" r="5"/><circle cx="280" cy="180" r="5"/>
  </g>
  <text x="200" y="284" font-size="16" font-weight="700" fill="#2563eb">(2) k = 50 N/m</text>
  <circle cx="330" cy="142.5" r="6" fill="#0f172a"/>
  <line x1="330" y1="150" x2="330" y2="330" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="340" y="170" font-size="15" fill="#0f172a">Giới hạn đàn hồi</text>
  <text x="400" y="94" font-size="15" fill="#475569">biến dạng dẻo</text>
</svg>
