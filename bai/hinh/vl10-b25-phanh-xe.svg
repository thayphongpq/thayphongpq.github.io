<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 335" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="335" fill="#ffffff"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker>
  </defs>
  <text x="260" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Phanh xe: quãng đường dừng</text>
  <text x="260" y="58" text-anchor="middle" font-size="16" fill="#475569">m = 1 000 kg, v₀ = 20 m/s, F<tspan font-size="12" dy="4">h</tspan><tspan dy="-4"> = 5 000 N</tspan></text>
  <!-- đường -->
  <rect x="10" y="200" width="500" height="10" fill="#e2e8f0"/>
  <line x1="10" y1="200" x2="510" y2="200" stroke="#334155" stroke-width="2"/>
  <!-- xe lúc bắt đầu phanh -->
  <path d="M72,164 L84,146 L120,146 L130,164 Z" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="2"/>
  <rect x="60" y="164" width="80" height="24" rx="5" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/>
  <circle cx="78" cy="192" r="8" fill="#334155"/>
  <circle cx="122" cy="192" r="8" fill="#334155"/>
  <line x1="70" y1="128" x2="150" y2="128" stroke="#2563eb" stroke-width="3.5" marker-end="url(#b)"/>
  <text x="110" y="117" text-anchor="middle" font-size="17" font-weight="700" fill="#2563eb">v₀ = 20 m/s</text>
  <line x1="60" y1="176" x2="14" y2="176" stroke="#dc2626" stroke-width="4" marker-end="url(#r)"/>
  <text x="34" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#dc2626">F<tspan font-size="13" dy="4">h</tspan></text>
  <!-- xe khi dừng -->
  <path d="M392,164 L404,146 L440,146 L450,164 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <rect x="380" y="164" width="80" height="24" rx="5" fill="#94a3b8" stroke="#64748b" stroke-width="2"/>
  <circle cx="398" cy="192" r="8" fill="#334155"/>
  <circle cx="442" cy="192" r="8" fill="#334155"/>
  <text x="420" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">v = 0</text>
  <!-- quãng đường phanh -->
  <g stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="140" y1="168" x2="140" y2="238"/>
    <line x1="460" y1="168" x2="460" y2="238"/>
  </g>
  <line x1="142" y1="228" x2="458" y2="228" stroke="#0f172a" stroke-width="2" marker-start="url(#k)" marker-end="url(#k)"/>
  <text x="300" y="254" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">s = 40 m</text>
  <!-- ghi chú -->
  <text x="260" y="290" text-anchor="middle" font-size="16" fill="#0f172a">F<tspan font-size="12" dy="4">h</tspan><tspan dy="-4"> · s = ½ m v₀² = 200 000 J  ⇒  s = 40 m</tspan></text>
  <text x="260" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">v₀ gấp đôi (40 m/s) thì s = 160 m (gấp 4 lần)</text>
</svg>
