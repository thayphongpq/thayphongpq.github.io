<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="440" fill="#ffffff"/>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <text x="260" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Lực trung bình khi va chạm</text>
  <text x="260" y="54" text-anchor="middle" font-size="16" fill="#475569">Người 60 kg đang có v = 15 m/s dừng lại: Δp = 900 kg·m/s</text>
  <!-- tỉ lệ: 0,01 s = 20 px; 1 000 N = 3 px; gốc (70, 380) -->
  <!-- không có túi khí: Δt = 0,01 s, F = 90 000 N -->
  <rect x="70" y="110" width="20" height="270" fill="#dc2626" fill-opacity="0.85"/>
  <!-- có túi khí: Δt = 0,2 s, F = 4 500 N -->
  <rect x="70" y="366.5" width="400" height="13.5" fill="#16a34a" fill-opacity="0.85"/>
  <!-- trục -->
  <line x1="70" y1="380" x2="505" y2="380" stroke="#334155" stroke-width="2" marker-end="url(#k)"/>
  <line x1="70" y1="380" x2="70" y2="80" stroke="#334155" stroke-width="2" marker-end="url(#k)"/>
  <text x="80" y="92" font-size="16" font-weight="700" fill="#334155">F (N)</text>
  <text x="500" y="364" text-anchor="end" font-size="16" font-weight="700" fill="#334155">t (s)</text>
  <g font-size="15" fill="#475569">
    <text x="62" y="115" text-anchor="end">90 000</text>
    <text x="62" y="372" text-anchor="end">4 500</text>
    <text x="62" y="398" text-anchor="end">0</text>
    <text x="90" y="400" text-anchor="middle">0,01</text>
    <text x="470" y="400" text-anchor="middle">0,2</text>
  </g>
  <line x1="470" y1="380" x2="470" y2="386" stroke="#334155" stroke-width="2"/>
  <line x1="90" y1="380" x2="90" y2="386" stroke="#334155" stroke-width="2"/>
  <!-- nhãn -->
  <text x="100" y="140" font-size="16" font-weight="700" fill="#dc2626">Không có túi khí: Δt = 0,01 s</text>
  <text x="100" y="164" font-size="16" fill="#dc2626">F = 900 : 0,01 = 90 000 N</text>
  <text x="290" y="324" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">Có túi khí: Δt = 0,2 s</text>
  <text x="290" y="348" text-anchor="middle" font-size="16" fill="#16a34a">F = 900 : 0,2 = 4 500 N</text>
  <text x="260" y="428" text-anchor="middle" font-size="16" fill="#0f172a">Hai hình chữ nhật có diện tích bằng nhau: F·Δt = Δp</text>
</svg>
