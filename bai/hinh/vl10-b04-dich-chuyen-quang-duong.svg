<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="380" fill="#ffffff"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <text x="260" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Quãng đường và độ dịch chuyển</text>
  <!-- đường đi: A (x=0) -> C (x=400 m) -> B (x=300 m); 1 m = 1 px * 1, gốc tại x=60 -->
  <path d="M60,110 L455,110" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#b)"/>
  <path d="M460,140 L366,140" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#b)"/>
  <text x="258" y="98" text-anchor="middle" font-size="17" fill="#2563eb">đi 400 m về phía đông</text>
  <text x="414" y="166" text-anchor="middle" font-size="17" fill="#2563eb">quay lại 100 m</text>
  <!-- trục -->
  <line x1="40" y1="215" x2="500" y2="215" stroke="#334155" stroke-width="2.5" marker-end="url(#k)"/>
  <text x="496" y="242" text-anchor="end" font-size="17" fill="#334155">x (m)</text>
  <g fill="#0f172a" font-size="17" text-anchor="middle">
    <circle cx="60" cy="215" r="8" fill="#0f172a"/><text x="60" y="244">0</text><text x="60" y="198" font-weight="700">A (nhà)</text>
    <circle cx="360" cy="215" r="8" fill="#16a34a"/><text x="360" y="244">300</text><text x="345" y="198" font-weight="700" fill="#16a34a">B (hiệu sách)</text>
    <circle cx="460" cy="215" r="8" fill="#0f172a"/><text x="460" y="244">400</text><text x="470" y="198" font-weight="700">C (trường)</text>
  </g>
  <!-- độ dịch chuyển -->
  <line x1="60" y1="285" x2="354" y2="285" stroke="#dc2626" stroke-width="5" marker-end="url(#r)"/>
  <text x="207" y="275" text-anchor="middle" font-size="19" font-weight="700" fill="#dc2626">d = 300 m</text>
  <g font-size="18" fill="#0f172a">
    <text x="30" y="330"><tspan fill="#2563eb" font-weight="700">Quãng đường:</tspan> s = 400 + 100 = 500 m</text>
    <text x="30" y="358"><tspan fill="#dc2626" font-weight="700">Độ dịch chuyển:</tspan> d = 300 m, hướng đông</text>
  </g>
</svg>
