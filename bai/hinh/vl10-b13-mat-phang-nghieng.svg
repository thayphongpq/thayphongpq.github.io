<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 450" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="450" fill="#ffffff"/>
  <defs>
    <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/></marker>
  </defs>
  <text x="260" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Trọng lực trên mặt phẳng nghiêng</text>
  <!-- mặt nghiêng: A (60,400), B (460,400), C (460,169.1); góc nghiêng 30° -->
  <polygon points="60,400 460,400 460,169.1" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <path d="M110,400 A50,50 0 0 0 103.3,375" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <text x="116" y="393" font-size="18" fill="#0f172a">α = 30°</text>
  <!-- vật: tâm G (272.7, 248.35) -->
  <rect x="-30" y="-25" width="60" height="50" rx="4" fill="#fde68a" stroke="#92400e" stroke-width="2" transform="translate(272.7,248.35) rotate(-30)"/>
  <!-- đường phụ hình bình hành -->
  <g stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="212.1" y1="283.35" x2="272.7" y2="388.35"/>
    <line x1="333.3" y1="353.35" x2="272.7" y2="388.35"/>
  </g>
  <!-- P = 140 px; P sin α = 70 px (xuống dốc); P cos α = 121,2 px (vuông góc mặt nghiêng) -->
  <line x1="272.7" y1="248.35" x2="272.7" y2="388.35" stroke="#b45309" stroke-width="5" marker-end="url(#p)"/>
  <line x1="272.7" y1="248.35" x2="212.1" y2="283.35" stroke="#16a34a" stroke-width="4" marker-end="url(#g)"/>
  <line x1="272.7" y1="248.35" x2="333.3" y2="353.35" stroke="#9333ea" stroke-width="4" marker-end="url(#v)"/>
  <line x1="272.7" y1="248.35" x2="212.1" y2="143.35" stroke="#2563eb" stroke-width="4" marker-end="url(#n)"/>
  <circle cx="272.7" cy="248.35" r="4" fill="#0f172a"/>
  <!-- nhãn -->
  <text x="280" y="330"font-size="20" font-weight="700" fill="#b45309">P</text>
  <text x="203" y="292" text-anchor="end" font-size="18" font-weight="700" fill="#16a34a">P sin α</text>
  <text x="342" y="352" font-size="18" font-weight="700" fill="#9333ea">P cos α</text>
  <text x="203" y="146" text-anchor="end" font-size="20" font-weight="700" fill="#2563eb">N</text>
  <text x="260" y="428" text-anchor="middle" font-size="16" fill="#0f172a">P sin α kéo vật xuống dốc; P cos α ép vật vào mặt nghiêng</text>
</svg>
