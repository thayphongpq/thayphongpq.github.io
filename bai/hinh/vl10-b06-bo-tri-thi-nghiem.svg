<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 396" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="396" fill="#ffffff"/>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <text x="260" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Bố trí thí nghiệm đo tốc độ</text>
  <!-- mặt bàn, giá đỡ, máng nghiêng -->
  <line x1="30" y1="300" x2="500" y2="300" stroke="#334155" stroke-width="3"/>
  <rect x="64" y="120" width="10" height="180" fill="#94a3b8"/>
  <rect x="468" y="284" width="24" height="16" fill="#94a3b8"/>
  <line x1="70" y1="120" x2="480" y2="280" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <!-- nam châm điện và viên bi -->
  <rect x="76" y="92" width="18" height="26" rx="2" fill="#475569"/>
  <circle cx="105" cy="119" r="10" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
  <text x="20" y="80" font-size="16" fill="#0f172a">Nam châm điện</text>
  <text x="118" y="104" font-size="16" fill="#0f172a">viên bi</text>
  <text x="85" y="205" font-size="16" fill="#475569">máng nghiêng</text>
  <!-- cổng quang điện E, F -->
  <rect x="194" y="118" width="12" height="58" rx="3" fill="#16a34a"/>
  <circle cx="200" cy="157" r="4" fill="#dc2626"/>
  <rect x="384" y="192" width="12" height="58" rx="3" fill="#16a34a"/>
  <circle cx="390" cy="231" r="4" fill="#dc2626"/>
  <text x="178" y="150" font-size="20" font-weight="700" fill="#16a34a">E</text>
  <text x="368" y="224" font-size="20" font-weight="700" fill="#16a34a">F</text>
  <!-- dây nối tới đồng hồ -->
  <polyline points="200,118 200,100 330,100" fill="none" stroke="#0f172a" stroke-width="2"/>
  <line x1="390" y1="192" x2="390" y2="140" stroke="#0f172a" stroke-width="2"/>
  <!-- đồng hồ hiện số -->
  <rect x="330" y="58" width="170" height="82" rx="8" fill="#1e293b"/>
  <rect x="345" y="68" width="140" height="40" rx="4" fill="#052e16"/>
  <text x="415" y="96" text-anchor="middle" font-size="22" font-weight="700" fill="#4ade80">0,780 s</text>
  <text x="415" y="129" text-anchor="middle" font-size="16" fill="#ffffff">MODE A↔B</text>
  <!-- khoảng cách s = EF -->
  <line x1="200" y1="175" x2="190" y2="198" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="390" y1="249" x2="380" y2="272" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="189" y1="199" x2="379" y2="273" stroke="#dc2626" stroke-width="2.5" marker-start="url(#r)" marker-end="url(#r)"/>
  <text x="250" y="288" font-size="18" font-weight="700" fill="#dc2626">s = 0,500 m</text>
  <!-- chú giải -->
  <g font-size="16" fill="#0f172a">
    <text x="20" y="330">E, F: cổng quang điện (E nối ổ A, F nối ổ B)</text>
    <text x="20" y="356">Chế độ A↔B: đo thời gian bi đi từ E đến F</text>
    <text x="20" y="382">Tốc độ trung bình trên đoạn EF: v = s / t</text>
  </g>
</svg>
