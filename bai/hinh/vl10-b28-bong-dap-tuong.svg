<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="420" fill="#ffffff"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <text x="260" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Bóng đập vào tường rồi bật ngược lại</text>
  <!-- bức tường -->
  <rect x="470" y="60" width="30" height="270" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
  <g stroke="#64748b" stroke-width="1.2">
    <line x1="470" y1="90" x2="500" y2="70"/>
    <line x1="470" y1="130" x2="500" y2="110"/>
    <line x1="470" y1="170" x2="500" y2="150"/>
    <line x1="470" y1="210" x2="500" y2="190"/>
    <line x1="470" y1="250" x2="500" y2="230"/>
    <line x1="470" y1="290" x2="500" y2="270"/>
    <line x1="470" y1="330" x2="500" y2="310"/>
  </g>
  <!-- tỉ lệ: 1 kg·m/s = 30 px -->
  <!-- trước va chạm: p1 = 5 kg·m/s hướng vào tường -->
  <text x="20" y="116" font-size="17" font-weight="700" fill="#0f172a">Trước va chạm</text>
  <circle cx="250" cy="110" r="18" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <line x1="270" y1="110" x2="420" y2="110" stroke="#2563eb" stroke-width="4" marker-end="url(#b)"/>
  <text x="345" y="94" text-anchor="middle" font-size="17" font-weight="700" fill="#2563eb">p₁ (v₁ = 10 m/s)</text>
  <!-- sau va chạm: p2 = 4 kg·m/s hướng ra xa tường -->
  <text x="20" y="216" font-size="17" font-weight="700" fill="#0f172a">Sau va chạm</text>
  <circle cx="430" cy="210" r="18" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <line x1="412" y1="210" x2="292" y2="210" stroke="#16a34a" stroke-width="4" marker-end="url(#g)"/>
  <text x="340" y="192" text-anchor="middle" font-size="17" font-weight="700" fill="#16a34a">p₂ (v₂ = 8 m/s)</text>
  <!-- độ biến thiên động lượng -->
  <text x="20" y="306" font-size="17" font-weight="700" fill="#0f172a">Độ biến thiên</text>
  <line x1="420" y1="300" x2="150" y2="300" stroke="#dc2626" stroke-width="4" marker-end="url(#r)"/>
  <text x="285" y="284" text-anchor="middle" font-size="17" font-weight="700" fill="#dc2626">Δp = p₂ − p₁ (cùng hướng lực của tường)</text>
  <!-- chiều dương -->
  <line x1="470" y1="358" x2="380" y2="358" stroke="#334155" stroke-width="2" marker-end="url(#k)"/>
  <text x="368" y="364" text-anchor="end" font-size="16" fill="#334155">Chiều dương (+)</text>
  <text x="260" y="402" text-anchor="middle" font-size="16" fill="#0f172a">m = 0,5 kg: p₁ = −5 kg·m/s; p₂ = 4 kg·m/s; Δp = 9 kg·m/s</text>
</svg>
