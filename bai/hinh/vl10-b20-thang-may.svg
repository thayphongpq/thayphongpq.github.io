<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 510" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="510" fill="#ffffff"/>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/></marker>
  </defs>
  <text x="260" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Trọng lượng biểu kiến trong thang máy</text>
  <text x="260" y="56" text-anchor="middle" font-size="16" fill="#475569">Thang máy đi lên nhanh dần đều, a = 2 m/s²</text>
  <!-- cáp và buồng thang máy -->
  <line x1="175" y1="66" x2="175" y2="90" stroke="#334155" stroke-width="3"/>
  <rect x="50" y="90" width="250" height="365" fill="#f1f5f9" stroke="#334155" stroke-width="3"/>
  <!-- người -->
  <g stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="175" cy="215" r="20"/>
    <line x1="175" y1="235" x2="175" y2="335"/>
    <line x1="175" y1="260" x2="140" y2="305"/>
    <line x1="175" y1="260" x2="210" y2="305"/>
    <line x1="175" y1="335" x2="152" y2="425"/>
    <line x1="175" y1="335" x2="198" y2="425"/>
  </g>
  <text x="212" y="190" font-size="16" fill="#0f172a">m = 60 kg</text>
  <!-- cân -->
  <rect x="125" y="425" width="100" height="30" rx="4" fill="#334155"/>
  <text x="175" y="446" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">720 N</text>
  <text x="115" y="446" text-anchor="end" font-size="16" fill="#0f172a">Cân</text>
  <!-- gia tốc -->
  <line x1="330" y1="340" x2="330" y2="230" stroke="#9333ea" stroke-width="4" marker-end="url(#p)"/>
  <text x="342" y="292" font-size="20" font-weight="700" fill="#9333ea">a</text>
  <!-- sơ đồ lực tác dụng lên người -->
  <line x1="440" y1="290" x2="440" y2="146" stroke="#2563eb" stroke-width="4" marker-end="url(#b)"/>
  <line x1="440" y1="290" x2="440" y2="410" stroke="#dc2626" stroke-width="4" marker-end="url(#r)"/>
  <circle cx="440" cy="290" r="6" fill="#0f172a"/>
  <text x="440" y="132" text-anchor="middle" font-size="18" font-weight="700" fill="#2563eb">N = 720 N</text>
  <text x="440" y="438" text-anchor="middle" font-size="18" font-weight="700" fill="#dc2626">P = 600 N</text>
  <text x="440" y="466" text-anchor="middle" font-size="16" fill="#475569">Sơ đồ lực</text>
  <text x="260" y="495" text-anchor="middle" font-size="17" fill="#0f172a">N = m(g + a) = 60·(10 + 2) = 720 N &gt; P</text>
</svg>
