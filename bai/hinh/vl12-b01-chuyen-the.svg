<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="340" fill="#ffffff"/>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  </defs>
  <!-- nút: Khí (280,70), Lỏng (110,270), Rắn (450,270); bán kính 34 -->
  <circle cx="280" cy="70" r="34" fill="#f1f5f9" stroke="#0f172a" stroke-width="2.5"/>
  <circle cx="110" cy="270" r="34" fill="#e0f2fe" stroke="#0f172a" stroke-width="2.5"/>
  <circle cx="450" cy="270" r="34" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
  <text x="280" y="68" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Khí</text>
  <text x="280" y="88" text-anchor="middle" font-size="14" fill="#475569">gas</text>
  <text x="110" y="268" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Lỏng</text>
  <text x="110" y="288" text-anchor="middle" font-size="14" fill="#475569">liquid</text>
  <text x="450" y="268" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Rắn</text>
  <text x="450" y="288" text-anchor="middle" font-size="14" fill="#475569">solid</text>
  <!-- cạnh Lỏng–Khí: đỏ = cần nhận nhiệt, xanh = toả nhiệt -->
  <line x1="129.8" y1="234.3" x2="248.0" y2="95.3" stroke="#dc2626" stroke-width="2.5" marker-end="url(#r)"/>
  <line x1="260.2" y1="105.7" x2="142.0" y2="244.7" stroke="#2563eb" stroke-width="2.5" marker-end="url(#b)"/>
  <text transform="translate(170,148) rotate(-49.6)" text-anchor="middle" font-size="14" fill="#dc2626">Hoá hơi (vaporization)</text>
  <text transform="translate(229,198) rotate(-49.6)" text-anchor="middle" font-size="14" fill="#2563eb">Ngưng tụ (condensation)</text>
  <!-- cạnh Khí–Rắn -->
  <line x1="312.0" y1="95.3" x2="430.2" y2="234.3" stroke="#2563eb" stroke-width="2.5" marker-end="url(#b)"/>
  <line x1="418.0" y1="244.7" x2="299.8" y2="105.7" stroke="#dc2626" stroke-width="2.5" marker-end="url(#r)"/>
  <text transform="translate(390,148) rotate(49.6)" text-anchor="middle" font-size="14" fill="#2563eb">Ngưng kết (deposition)</text>
  <text transform="translate(331,198) rotate(49.6)" text-anchor="middle" font-size="14" fill="#dc2626">Thăng hoa (sublimation)</text>
  <!-- cạnh Lỏng–Rắn -->
  <line x1="150" y1="260" x2="410" y2="260" stroke="#2563eb" stroke-width="2.5" marker-end="url(#b)"/>
  <line x1="410" y1="280" x2="150" y2="280" stroke="#dc2626" stroke-width="2.5" marker-end="url(#r)"/>
  <text x="280" y="250" text-anchor="middle" font-size="14" fill="#2563eb">Đông đặc (freezing)</text>
  <text x="280" y="300" text-anchor="middle" font-size="14" fill="#dc2626">Nóng chảy (melting)</text>
  <!-- chú thích -->
  <line x1="150" y1="325" x2="180" y2="325" stroke="#dc2626" stroke-width="2.5"/>
  <text x="186" y="330" font-size="13" fill="#0f172a">nhận nhiệt (absorbs heat)</text>
  <line x1="350" y1="325" x2="380" y2="325" stroke="#2563eb" stroke-width="2.5"/>
  <text x="386" y="330" font-size="13" fill="#0f172a">toả nhiệt (releases heat)</text>
</svg>
