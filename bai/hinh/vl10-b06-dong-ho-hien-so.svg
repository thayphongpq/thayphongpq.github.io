<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 510" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="510" fill="#ffffff"/>
  <text x="260" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Đồng hồ đo thời gian hiện số</text>
  <!-- thân đồng hồ -->
  <rect x="30" y="56" width="460" height="150" rx="14" fill="#1e293b"/>
  <rect x="54" y="74" width="236" height="64" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
  <text x="272" y="122" text-anchor="end" font-size="40" font-weight="700" fill="#4ade80">0,780</text>
  <text x="300" y="122" font-size="20" fill="#ffffff">s</text>
  <circle cx="380" cy="100" r="18" fill="#0f172a" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="450" cy="100" r="18" fill="#0f172a" stroke="#94a3b8" stroke-width="3"/>
  <text x="380" y="146" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">A</text>
  <text x="450" y="146" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">B</text>
  <rect x="54" y="152" width="104" height="38" rx="6" fill="#2563eb"/>
  <text x="106" y="177" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">MODE</text>
  <rect x="172" y="152" width="118" height="38" rx="6" fill="#dc2626"/>
  <text x="231" y="177" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">RESET</text>
  <text x="415" y="190" text-anchor="middle" font-size="16" fill="#cbd5e1">9,999 s / 99,99 s</text>
  <!-- các chế độ MODE -->
  <text x="30" y="244" font-size="19" font-weight="700" fill="#0f172a">Các chế độ đo (MODE)</text>
  <g font-size="17">
    <rect x="30" y="262" width="70" height="30" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="65" y="283" text-anchor="middle" font-weight="700" fill="#0369a1">A</text>
    <text x="112" y="283" fill="#0f172a">thời gian vật chắn cổng nối ổ A</text>
    <rect x="30" y="302" width="70" height="30" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="65" y="323" text-anchor="middle" font-weight="700" fill="#0369a1">B</text>
    <text x="112" y="323" fill="#0f172a">thời gian vật chắn cổng nối ổ B</text>
    <rect x="30" y="342" width="70" height="30" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="65" y="363" text-anchor="middle" font-weight="700" fill="#0369a1">A+B</text>
    <text x="112" y="363" fill="#0f172a">tổng thời gian chắn cổng A và cổng B</text>
    <rect x="30" y="382" width="70" height="30" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="65" y="403" text-anchor="middle" font-weight="700" fill="#0369a1">A↔B</text>
    <text x="112" y="403" fill="#0f172a">từ lúc chắn cổng A đến lúc chắn cổng B</text>
    <rect x="30" y="422" width="70" height="30" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="65" y="443" text-anchor="middle" font-weight="700" fill="#0369a1">T</text>
    <text x="112" y="443" fill="#0f172a">chu kì dao động (vật đi qua cổng A)</text>
  </g>
  <text x="260" y="490" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">v trung bình: chọn A↔B · v tức thời: chọn A hoặc B</text>
</svg>
