<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="820" height="300" fill="#ffffff"/>
  <text x="410" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Các lần đo phân bố quanh giá trị trung bình</text>
  <!-- trục số: 0,396 s (x=110) đến 0,404 s (x=710), 75 px cho 0,001 s -->
  <rect x="260" y="95" width="300" height="80" fill="#dcfce7"/>
  <text x="410" y="88" text-anchor="middle" font-size="14" fill="#15803d">vùng t̄ ± Δt: từ 0,398 s đến 0,402 s</text>
  <line x1="80" y1="175" x2="750" y2="175" stroke="#334155" stroke-width="2"/>
  <g stroke="#334155" stroke-width="2">
    <line x1="110" y1="170" x2="110" y2="180"/><line x1="185" y1="170" x2="185" y2="180"/><line x1="260" y1="170" x2="260" y2="180"/>
    <line x1="335" y1="170" x2="335" y2="180"/><line x1="410" y1="170" x2="410" y2="180"/><line x1="485" y1="170" x2="485" y2="180"/>
    <line x1="560" y1="170" x2="560" y2="180"/><line x1="635" y1="170" x2="635" y2="180"/><line x1="710" y1="170" x2="710" y2="180"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#334155">
    <text x="110" y="198">0,396</text><text x="185" y="198">0,397</text><text x="260" y="198">0,398</text>
    <text x="335" y="198">0,399</text><text x="410" y="198">0,400</text><text x="485" y="198">0,401</text>
    <text x="560" y="198">0,402</text><text x="635" y="198">0,403</text><text x="710" y="198">0,404</text>
    <text x="770" y="180" font-size="15">t (s)</text>
  </g>
  <g fill="#2563eb">
    <circle cx="485" cy="155" r="9"/><circle cx="335" cy="155" r="9"/><circle cx="560" cy="155" r="9"/>
    <circle cx="410" cy="155" r="9"/><circle cx="260" cy="155" r="9"/>
  </g>
  <line x1="410" y1="100" x2="410" y2="175" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 4"/>
  <rect x="362" y="110" width="96" height="22" rx="4" fill="#ffffff" stroke="#dc2626"/>
  <text x="410" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">t̄ = 0,400 s</text>
  <g font-size="14" fill="#0f172a">
    <circle cx="90" cy="236" r="7" fill="#2563eb"/><text x="104" y="241">5 lần đo: 0,401; 0,399; 0,402; 0,400; 0,398 (s)</text>
    <line x1="83" y1="266" x2="97" y2="266" stroke="#dc2626" stroke-width="3" stroke-dasharray="4 3"/><text x="104" y="271">Giá trị trung bình (gần giá trị thật nhất)</text>
    <rect x="470" y="226" width="16" height="14" fill="#dcfce7" stroke="#15803d"/><text x="494" y="238">Kết quả: t = 0,400 ± 0,002 s</text>
    <text x="494" y="262" fill="#475569">Δt = sai số ngẫu nhiên + sai số dụng cụ</text>
  </g>
</svg>
