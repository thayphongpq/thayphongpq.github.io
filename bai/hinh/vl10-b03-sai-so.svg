<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="420" fill="#ffffff"/>
  <text x="260" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">5 lần đo nằm quanh giá trị trung bình</text>
  <!-- trục: 0,397 (x=50) ... 0,403 (x=470), 70 px cho 0,001 s -->
  <rect x="120" y="105" width="280" height="105" fill="#dcfce7"/>
  <text x="260" y="96" text-anchor="middle" font-size="17" fill="#15803d">vùng t̄ ± Δt (0,398 s đến 0,402 s)</text>
  <line x1="30" y1="210" x2="495" y2="210" stroke="#334155" stroke-width="2.5"/>
  <g stroke="#334155" stroke-width="2.5">
    <line x1="50" y1="203" x2="50" y2="217"/><line x1="120" y1="203" x2="120" y2="217"/><line x1="190" y1="203" x2="190" y2="217"/>
    <line x1="260" y1="203" x2="260" y2="217"/><line x1="330" y1="203" x2="330" y2="217"/><line x1="400" y1="203" x2="400" y2="217"/>
    <line x1="470" y1="203" x2="470" y2="217"/>
  </g>
  <g font-size="16" text-anchor="middle" fill="#334155">
    <text x="50" y="238">0,397</text><text x="120" y="238">0,398</text><text x="190" y="238">0,399</text>
    <text x="260" y="238">0,400</text><text x="330" y="238">0,401</text><text x="400" y="238">0,402</text>
    <text x="470" y="238">0,403</text>
  </g>
  <text x="495" y="262" text-anchor="end" font-size="17" fill="#334155">t (s)</text>
  <g fill="#2563eb">
    <circle cx="330" cy="188" r="10"/><circle cx="190" cy="188" r="10"/><circle cx="400" cy="188" r="10"/>
    <circle cx="260" cy="188" r="10"/><circle cx="120" cy="188" r="10"/>
  </g>
  <line x1="260" y1="110" x2="260" y2="210" stroke="#dc2626" stroke-width="3" stroke-dasharray="7 5"/>
  <rect x="200" y="122" width="120" height="30" rx="5" fill="#ffffff" stroke="#dc2626"/>
  <text x="260" y="144" text-anchor="middle" font-size="18" font-weight="700" fill="#dc2626">t̄ = 0,400 s</text>
  <g font-size="17" fill="#0f172a">
    <circle cx="40" cy="296" r="8" fill="#2563eb"/><text x="56" y="302">Các lần đo: 0,401; 0,399; 0,402;</text>
    <text x="56" y="324">0,400; 0,398 (s)</text>
    <line x1="32" y1="350" x2="50" y2="350" stroke="#dc2626" stroke-width="3" stroke-dasharray="5 3"/><text x="56" y="356">Giá trị trung bình t̄</text>
    <rect x="32" y="372" width="18" height="16" fill="#dcfce7" stroke="#15803d"/><text x="56" y="386" font-weight="700">Kết quả: t = 0,400 ± 0,002 s</text>
  </g>
</svg>
