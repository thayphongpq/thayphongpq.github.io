<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="400" fill="#ffffff"/>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <text x="260" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Rơi trong không khí: tốc độ giới hạn</text>
  <text x="260" y="60" text-anchor="middle" font-size="16" fill="#475569">Người nhảy dù 80 kg, chưa bung dù, g = 10 m/s²</text>
  <!-- gốc (70,350); trục t: 28 px = 1 s; trục v: 4 px = 1 m/s; mô hình F_c = kv², v = 50·tanh(0,2t) -->
  <line x1="60" y1="350" x2="505" y2="350" stroke="#334155" stroke-width="2" marker-end="url(#k)"/>
  <line x1="70" y1="360" x2="70" y2="88" stroke="#334155" stroke-width="2" marker-end="url(#k)"/>
  <text x="500" y="340" text-anchor="end" font-size="16" fill="#334155">t (s)</text>
  <text x="80" y="100" font-size="16" fill="#334155">v (m/s)</text>
  <g stroke="#334155" stroke-width="2">
    <line x1="210" y1="350" x2="210" y2="356"/><line x1="350" y1="350" x2="350" y2="356"/><line x1="490" y1="350" x2="490" y2="356"/>
    <line x1="64" y1="250" x2="70" y2="250"/><line x1="64" y1="150" x2="70" y2="150"/>
  </g>
  <g font-size="15" fill="#334155" text-anchor="middle">
    <text x="70" y="372">0</text><text x="210" y="372">5</text><text x="350" y="372">10</text><text x="490" y="372">15</text>
  </g>
  <text x="60" y="255" text-anchor="end" font-size="15" fill="#334155">25</text>
  <text x="60" y="155" text-anchor="end" font-size="15" fill="#334155">50</text>
  <!-- tốc độ giới hạn -->
  <line x1="70" y1="150" x2="490" y2="150" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="488" y="140" text-anchor="end" font-size="16" font-weight="700" fill="#dc2626">v<tspan font-size="12" dy="4">gh</tspan><tspan dy="-4"> = 50 m/s</tspan></text>
  <!-- nếu không có lực cản: v = gt -->
  <line x1="70" y1="350" x2="238" y2="110" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="245" y="118" font-size="15" fill="#64748b">Nếu không có lực cản: v = gt</text>
  <!-- có lực cản -->
  <polyline points="70,350 98,310.5 126,274 154,242.6 182,217.2 210,197.7 238,183.3 266,172.9 294,165.7 322,160.6 350,157.2 406,153.3 490,151" fill="none" stroke="#2563eb" stroke-width="4" stroke-linejoin="round"/>
  <text x="250" y="222" font-size="16" font-weight="700" fill="#2563eb">Có lực cản không khí</text>
  <text x="250" y="244" font-size="16" fill="#2563eb">v tăng chậm dần tới v<tspan font-size="12" dy="4">gh</tspan></text>
  <!-- lực khi đạt v_gh -->
  <circle cx="420" cy="300" r="10" fill="#475569"/>
  <line x1="420" y1="290" x2="420" y2="255" stroke="#16a34a" stroke-width="4" marker-end="url(#g)"/>
  <line x1="420" y1="310" x2="420" y2="342" stroke="#dc2626" stroke-width="4" marker-end="url(#r)"/>
  <text x="430" y="270" font-size="17" font-weight="700" fill="#16a34a">F<tspan font-size="12" dy="4">c</tspan></text>
  <text x="430" y="338" font-size="17" font-weight="700" fill="#dc2626">P</text>
  <text x="260" y="394" text-anchor="middle" font-size="15" fill="#0f172a">Khi F<tspan font-size="11" dy="4">c</tspan><tspan dy="-4"> = P: hợp lực bằng 0, vật rơi đều với v</tspan><tspan font-size="11" dy="4">gh</tspan></text>
</svg>
