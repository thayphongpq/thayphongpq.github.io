<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="470" fill="#ffffff"/>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <text x="260" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Tổng động lượng trước và sau va chạm</text>
  <text x="260" y="56" text-anchor="middle" font-size="16" fill="#475569">Lần đo 1, đơn vị p: kg·m/s</text>
  <!-- chú giải -->
  <rect x="110" y="74" width="18" height="18" fill="#3b82f6"/>
  <text x="136" y="89" font-size="16" fill="#0f172a">Trước va chạm</text>
  <rect x="300" y="74" width="18" height="18" fill="#f59e0b"/>
  <text x="326" y="89" font-size="16" fill="#0f172a">Sau va chạm</text>
  <!-- tỉ lệ: 0,01 kg·m/s = 20 px; gốc (80, 400) -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="80" y1="320" x2="490" y2="320"/>
    <line x1="80" y1="240" x2="490" y2="240"/>
    <line x1="80" y1="160" x2="490" y2="160"/>
  </g>
  <line x1="80" y1="400" x2="500" y2="400" stroke="#334155" stroke-width="2"/>
  <line x1="80" y1="400" x2="80" y2="110" stroke="#334155" stroke-width="2" marker-end="url(#k)"/>
  <text x="90" y="122" font-size="16" fill="#334155">p</text>
  <g font-size="14" fill="#334155" text-anchor="end">
    <text x="72" y="405">0</text>
    <text x="72" y="325">0,04</text>
    <text x="72" y="245">0,08</text>
    <text x="72" y="165">0,12</text>
  </g>
  <!-- va chạm đàn hồi -->
  <rect x="120" y="150" width="60" height="250" fill="#3b82f6"/>
  <rect x="190" y="159" width="60" height="241" fill="#f59e0b"/>
  <text x="150" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">0,1250</text>
  <text x="220" y="151" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">0,1205</text>
  <!-- va chạm mềm -->
  <rect x="310" y="150" width="60" height="250" fill="#3b82f6"/>
  <rect x="380" y="160" width="60" height="240" fill="#f59e0b"/>
  <text x="340" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">0,1250</text>
  <text x="410" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">0,1200</text>
  <text x="185" y="424" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Va chạm đàn hồi</text>
  <text x="375" y="424" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Va chạm mềm</text>
  <text x="260" y="454" text-anchor="middle" font-size="16" fill="#0f172a">Chênh lệch: 3,6% (đàn hồi) và 4,0% (mềm)</text>
</svg>
