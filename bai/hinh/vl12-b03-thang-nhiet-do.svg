<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="360" fill="#ffffff"/>
  <!-- nhiệt kế Celsius x=150, Kelvin x=410; ống từ y=40 đến y=305, bầu ở y=320 -->
  <text x="150" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Celsius (t)</text>
  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Kelvin (T)</text>
  <rect x="142" y="40" width="16" height="268" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <rect x="402" y="40" width="16" height="268" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <rect x="146" y="150" width="8" height="160" fill="#dc2626"/>
  <rect x="406" y="150" width="8" height="160" fill="#dc2626"/>
  <circle cx="150" cy="322" r="15" fill="#dc2626" stroke="#0f172a" stroke-width="2"/>
  <circle cx="410" cy="322" r="15" fill="#dc2626" stroke="#0f172a" stroke-width="2"/>
  <!-- ngắt thang (không theo tỉ lệ) giữa 0 °C và -273 °C -->
  <path d="M136,214 L164,206 M136,224 L164,216" stroke="#0f172a" stroke-width="2"/>
  <path d="M396,214 L424,206 M396,224 L424,216" stroke="#0f172a" stroke-width="2"/>
  <!-- các mốc -->
  <line x1="130" y1="70" x2="430" y2="70" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="130" y1="160" x2="430" y2="160" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="130" y1="270" x2="430" y2="270" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="122" y="76" text-anchor="end" font-size="18" fill="#0f172a">100 °C</text>
  <text x="122" y="166" text-anchor="end" font-size="18" fill="#0f172a">0 °C</text>
  <text x="122" y="276" text-anchor="end" font-size="18" fill="#0f172a">−273 °C</text>
  <text x="438" y="76" font-size="18" fill="#0f172a">373 K</text>
  <text x="438" y="166" font-size="18" fill="#0f172a">273 K</text>
  <text x="438" y="276" font-size="18" font-weight="700" fill="#2563eb">0 K</text>
  <text x="280" y="62" text-anchor="middle" font-size="13" fill="#475569">nước sôi (water boils)</text>
  <text x="280" y="152" text-anchor="middle" font-size="13" fill="#475569">nước đá tan (ice melts)</text>
  <text x="280" y="262" text-anchor="middle" font-size="13" fill="#2563eb">độ không tuyệt đối (absolute zero)</text>
  <!-- khoảng 100 độ -->
  <line x1="280" y1="76" x2="280" y2="140" stroke="#16a34a" stroke-width="2"/>
  <text x="288" y="113" font-size="15" font-weight="700" fill="#16a34a">ΔT = Δt = 100</text>
  <text x="280" y="352" text-anchor="middle" font-size="18" font-style="italic" fill="#0f172a">T = t + 273</text>
</svg>
