<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="410" fill="#ffffff"/>
  <text x="260" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Dòng năng lượng qua động cơ điện</text>
  <text x="260" y="58" text-anchor="middle" font-size="16" fill="#475569">Độ rộng mỗi dải tỉ lệ với lượng năng lượng</text>
  <!-- năng lượng toàn phần: 100 J = 100 px -->
  <polygon points="20,110 185,110 200,160 185,210 20,210" fill="#2563eb"/>
  <text x="100" y="155" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">W<tspan font-size="13" dy="5">tp</tspan><tspan dy="-5"> = 100 J</tspan></text>
  <text x="100" y="180" text-anchor="middle" font-size="16" fill="#ffffff">(điện năng)</text>
  <!-- động cơ -->
  <rect x="200" y="95" width="100" height="130" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="250" y="155" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Động cơ</text>
  <text x="250" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">điện</text>
  <!-- năng lượng có ích: 80 J = 80 px -->
  <polygon points="300,110 470,110 505,150 470,190 300,190" fill="#16a34a"/>
  <text x="395" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">W<tspan font-size="13" dy="5">ci</tspan><tspan dy="-5"> = 80 J</tspan></text>
  <text x="395" y="172" text-anchor="middle" font-size="16" fill="#ffffff">(cơ năng)</text>
  <!-- năng lượng hao phí: 20 J = 20 px -->
  <polygon points="240,225 260,225 260,300 272,300 250,325 228,300 240,300" fill="#ea580c"/>
  <text x="282" y="272" font-size="18" font-weight="700" fill="#ea580c">W<tspan font-size="13" dy="5">hp</tspan><tspan dy="-5"> = 20 J</tspan></text>
  <text x="282" y="296" font-size="16" fill="#ea580c">(nhiệt, tiếng ồn)</text>
  <!-- công thức -->
  <text x="260" y="368" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">H = W<tspan font-size="14" dy="5">ci</tspan><tspan dy="-5"> : W</tspan><tspan font-size="14" dy="5">tp</tspan><tspan dy="-5"> = 80 : 100 = 80%</tspan></text>
  <text x="260" y="396" text-anchor="middle" font-size="17" fill="#475569">W<tspan font-size="12" dy="4">tp</tspan><tspan dy="-4"> = W</tspan><tspan font-size="12" dy="4">ci</tspan><tspan dy="-4"> + W</tspan><tspan font-size="12" dy="4">hp</tspan></text>
</svg>
