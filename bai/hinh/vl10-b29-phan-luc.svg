<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="470" fill="#ffffff"/>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  </defs>
  <text x="260" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Chuyển động bằng phản lực</text>
  <!-- SÚNG GIẬT LÙI -->
  <text x="20" y="70" font-size="18" font-weight="700" fill="#0f172a">1. Súng giật lùi</text>
  <polygon points="120,118 205,118 205,146 178,146 160,172 120,172" fill="#78716c" stroke="#44403c" stroke-width="2"/>
  <rect x="205" y="120" width="155" height="14" fill="#57534e" stroke="#44403c" stroke-width="2"/>
  <text x="285" y="160" text-anchor="middle" font-size="16" fill="#0f172a">súng M = 4 kg</text>
  <ellipse cx="410" cy="127" rx="13" ry="6" fill="#b45309"/>
  <text x="410" y="157" text-anchor="middle" font-size="16" fill="#0f172a">đạn m = 20 g</text>
  <line x1="430" y1="127" x2="505" y2="127" stroke="#dc2626" stroke-width="4" marker-end="url(#r)"/>
  <text x="466" y="108" text-anchor="middle" font-size="17" font-weight="700" fill="#dc2626">v = 600 m/s</text>
  <line x1="175" y1="195" x2="100" y2="195" stroke="#2563eb" stroke-width="4" marker-end="url(#b)"/>
  <text x="200" y="201" font-size="17" font-weight="700" fill="#2563eb">V = 3 m/s (giật lùi)</text>
  <line x1="20" y1="240" x2="500" y2="240" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 5"/>
  <!-- TÊN LỬA -->
  <text x="20" y="272" font-size="18" font-weight="700" fill="#0f172a">2. Tên lửa</text>
  <polygon points="200,336 150,350 200,364" fill="#fb923c"/>
  <polygon points="200,341 172,350 200,359" fill="#fde047"/>
  <polygon points="215,330 195,312 245,330" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
  <polygon points="215,370 195,388 245,370" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
  <rect x="200" y="330" width="140" height="40" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <polygon points="340,330 382,350 340,370" fill="#dc2626" stroke="#475569" stroke-width="2"/>
  <circle cx="300" cy="350" r="9" fill="#bae6fd" stroke="#475569" stroke-width="1.5"/>
  <line x1="140" y1="350" x2="60" y2="350" stroke="#dc2626" stroke-width="4" marker-end="url(#r)"/>
  <text x="100" y="334" text-anchor="middle" font-size="17" font-weight="700" fill="#dc2626">khí: v</text>
  <line x1="392" y1="350" x2="472" y2="350" stroke="#2563eb" stroke-width="4" marker-end="url(#b)"/>
  <text x="432" y="334" text-anchor="middle" font-size="17" font-weight="700" fill="#2563eb">tên lửa: V</text>
  <text x="260" y="420" text-anchor="middle" font-size="17" fill="#0f172a">Ban đầu đứng yên: m·v + M·V = 0</text>
  <text x="260" y="448" text-anchor="middle" font-size="17" fill="#0f172a">⇒ V = −(m/M)·v: ngược hướng với v</text>
</svg>
