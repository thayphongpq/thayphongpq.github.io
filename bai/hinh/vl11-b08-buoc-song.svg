<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="300" fill="#ffffff"/>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <line x1="40" y1="160" x2="530" y2="160" stroke="#0f172a" stroke-width="2" marker-end="url(#m)"/>
  <line x1="40" y1="280" x2="40" y2="30" stroke="#0f172a" stroke-width="2" marker-end="url(#m)"/>
  <text x="518" y="185" font-size="20" font-style="italic" fill="#0f172a">x</text>
  <text x="50" y="36" font-size="20" font-style="italic" fill="#0f172a">u</text>
  <!-- u = -A sin(2πx/λ)... dùng u = A sin(2π(x-40)/200), A = 90 px -->
  <polyline points="40,160 50,132.2 60,107.1 70,87.2 80,74.4 90,70 100,74.4 110,87.2 120,107.1 130,132.2 140,160 150,187.8 160,212.9 170,232.8 180,245.6 190,250 200,245.6 210,232.8 220,212.9 230,187.8 240,160 250,132.2 260,107.1 270,87.2 280,74.4 290,70 300,74.4 310,87.2 320,107.1 330,132.2 340,160 350,187.8 360,212.9 370,232.8 380,245.6 390,250 400,245.6 410,232.8 420,212.9 430,187.8 440,160 450,132.2 460,107.1 470,87.2 480,74.4 490,70" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- bước sóng giữa hai đỉnh x=90 và x=290 -->
  <line x1="90" y1="60" x2="90" y2="45" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="290" y1="60" x2="290" y2="45" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="92" y1="50" x2="288" y2="50" stroke="#16a34a" stroke-width="2.5" marker-start="url(#g)" marker-end="url(#g)"/>
  <text x="190" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#16a34a">λ</text>
  <!-- biên độ -->
  <line x1="390" y1="160" x2="390" y2="254" stroke="#dc2626" stroke-width="2.5" marker-end="url(#r)"/>
  <text x="400" y="215" font-size="20" font-weight="700" fill="#dc2626">A</text>
  <!-- chiều truyền sóng -->
  <line x1="400" y1="40" x2="500" y2="40" stroke="#0f172a" stroke-width="2.5" marker-end="url(#m)"/>
  <text x="450" y="30" text-anchor="middle" font-size="15" fill="#475569">v (truyền sóng / propagation)</text>
  <text x="280" y="292" text-anchor="middle" font-size="15" fill="#475569">Hình dạng sợi dây tại một thời điểm (shape of the string at one instant)</text>
</svg>
