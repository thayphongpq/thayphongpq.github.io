<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="400" fill="#ffffff"/>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <text x="260" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Thí nghiệm lí tưởng của Galilei</text>
  <text x="260" y="56" text-anchor="middle" font-size="16" fill="#475569">Hai máng nghiêng rất trơn (bỏ qua ma sát)</text>
  <!-- đường độ cao ban đầu h (y = 140) -->
  <line x1="30" y1="140" x2="505" y2="140" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <!-- máng thứ nhất và đoạn đáy -->
  <polyline points="40,140 200,300 250,300" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round"/>
  <!-- máng thứ hai: (1) dốc, (2) thoải, (3) nằm ngang -->
  <line x1="250" y1="300" x2="320" y2="140" stroke="#2563eb" stroke-width="4"/>
  <line x1="250" y1="300" x2="490" y2="140" stroke="#16a34a" stroke-width="4"/>
  <line x1="250" y1="300" x2="505" y2="300" stroke="#dc2626" stroke-width="4" marker-end="url(#r)"/>
  <!-- viên bi -->
  <circle cx="57.1" cy="132.9" r="10" fill="#f59e0b" stroke="#92400e" stroke-width="2"/>
  <circle cx="306.9" cy="145" r="9" fill="#f59e0b" stroke="#92400e" stroke-width="2" opacity="0.85"/>
  <circle cx="472.4" cy="139.7" r="9" fill="#f59e0b" stroke="#92400e" stroke-width="2" opacity="0.85"/>
  <circle cx="440" cy="290" r="10" fill="#f59e0b" stroke="#92400e" stroke-width="2"/>
  <text x="74" y="122" font-size="16" fill="#0f172a">Thả bi</text>
  <!-- độ cao h -->
  <line x1="225" y1="144" x2="225" y2="296" stroke="#334155" stroke-width="1.8" marker-start="url(#k)" marker-end="url(#k)"/>
  <text x="232" y="228" font-size="19" font-style="italic" font-weight="700" fill="#0f172a">h</text>
  <!-- nhãn các trường hợp -->
  <text x="326" y="192" font-size="18" font-weight="700" fill="#2563eb">(1)</text>
  <text x="440" y="206" font-size="18" font-weight="700" fill="#16a34a">(2)</text>
  <text x="318" y="288" font-size="17" font-weight="700" fill="#dc2626">(3) lăn mãi</text>
  <!-- chú thích -->
  <text x="20" y="336" font-size="16" fill="#0f172a">(1), (2): bi luôn lên tới độ cao ban đầu h;</text>
  <text x="20" y="360" font-size="16" fill="#0f172a">máng càng thoải, bi lăn càng xa.</text>
  <text x="20" y="384" font-size="16" fill="#dc2626">(3) máng nằm ngang: bi chuyển động thẳng đều mãi mãi.</text>
</svg>
